# App iPhone di seeva (Fil, 2026-10-29).
# Come per l'APK Android: a ogni push su main GitHub prende un Mac "in
# prestito", costruisce l'app iPhone con i file aggiornati e
#  - SE su GitHub ci sono i segreti di Apple (vedi elenco sotto), la firma e
#    la carica su App Store Connect -> dopo 10-30 minuti arriva su TestFlight
#    (Virgi e gli altri tester la aggiornano dall'app TestFlight);
#  - se i segreti NON ci sono ancora, la compila solo per il simulatore,
#    giusto per controllare che non ci siano errori. Nessun file da scaricare.
# Si può anche lanciare a mano da Actions > "App iPhone" > Run workflow.
#
# Segreti da mettere su GitHub (Settings > Secrets and variables > Actions),
# li prepara Virgi dal suo Mac (vedi PDF "seeva - cose da fare per Virgi"):
#   APPLE_TEAM_ID             Team ID (10 caratteri) dell'account Apple Developer
#   IOS_DIST_CERT_P12         certificato "Apple Distribution" .p12, in base64
#   IOS_DIST_CERT_PASSWORD    password scelta quando si è esportato il .p12
#   IOS_PROFILE               profilo "App Store" per it.seeva.app (.mobileprovision), in base64
#   ASC_KEY_ID                chiave API di App Store Connect: Key ID
#   ASC_ISSUER_ID             chiave API di App Store Connect: Issuer ID
#   ASC_KEY_P8                chiave API di App Store Connect: contenuto del file .p8
name: App iPhone

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  build:
    # Apple vuole app fatte con Xcode 26 (SDK iOS 26): serve il Mac "macos-26"
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HAS_APPLE_SECRETS: ${{ secrets.IOS_DIST_CERT_P12 != '' && secrets.IOS_PROFILE != '' && secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Versione di Xcode
        run: xcodebuild -version

      - name: Build del sito (dist/)
        run: |
          npm install --no-audit --no-fund
          node build.mjs

      - name: Copia i file nell'app iPhone
        working-directory: _app_android
        run: |
          npm install --no-audit --no-fund
          node prepara-web.mjs
          npx cap sync ios

      # ---- Senza segreti Apple: solo controllo che si compili ----
      - name: Compila per il simulatore (controllo)
        if: ${{ env.HAS_APPLE_SECRETS != 'true' }}
        working-directory: _app_android/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          echo "Compilata per il simulatore. Mancano i segreti Apple: niente TestFlight per ora."

      # ---- Con i segreti: firma e invio a App Store Connect / TestFlight ----
      - name: Prepara certificato e profilo
        if: ${{ env.HAS_APPLE_SECRETS == 'true' }}
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/seeva.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo -n "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/seeva.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

          security cms -D -i "$RUNNER_TEMP/seeva.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$RUNNER_TEMP/seeva.mobileprovision" "$d/$PROFILE_UUID.mobileprovision"
          done
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Profilo: $PROFILE_NAME ($PROFILE_UUID)"

          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"

      - name: Costruisci l'app firmata (archive)
        if: ${{ env.HAS_APPLE_SECRETS == 'true' }}
        working-directory: _app_android/ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # Numero di build = numero di questa esecuzione (deve sempre crescere)
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/seeva.xcarchive" \
            SEEVA_TEAM_ID="$TEAM_ID" SEEVA_PROFILE_NAME="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -n 60

      - name: Invia a App Store Connect (TestFlight)
        if: ${{ env.HAS_APPLE_SECRETS == 'true' }}
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>it.seeva.app</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/seeva.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 40
          echo "Inviata: build n. ${{ github.run_number }}. Tra 10-30 minuti la trovi su TestFlight."

      - name: Pulizia
        if: ${{ always() && env.HAS_APPLE_SECRETS == 'true' }}
        run: |
          security delete-keychain "$RUNNER_TEMP/seeva.keychain-db" || true
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/seeva.mobileprovision" "$RUNNER_TEMP/profile.plist"
