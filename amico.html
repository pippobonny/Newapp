<!DOCTYPE html>
<html lang="it" translate="no">
<head>
<meta charset="UTF-8">

<script>
  /* Fix navbar tagliata sull'app installata (PWA a schermo intero): su alcuni
     Android/Chrome 100dvh non combacia col vero window.innerHeight quando
     l'app gira standalone, e la navbar finisce a metà, sotto la gesture bar.
     Misuriamo noi lo spazio vero e lo passiamo a style.css via --app-height.
     Solo in standalone: in Safari normale (scheda del browser) 100dvh da solo
     si aggiorna già correttamente quando la barra degli indirizzi si nasconde/
     mostra, mentre un innerHeight misurato una volta e aggiornato solo su
     resize/orientationchange restava indietro e lasciava una striscia grigia
     sotto la tab bar (bug notato da Fil su iPhone il 2026-07-05). */
  (function () {
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (!isStandalone) return;
    function setAppHeight() {
      document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
    }
    setAppHeight();
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', setAppHeight);
  })();
</script>
<style>
  /* Giorni da votare nell'invito (Fil, 2026-10-25): riquadri bianchi ben
     visibili, verdi quando scelti (in evento.html stanno dentro una card,
     qui sono sullo sfondo della pagina). */
  #inviteDayGrid .day-card { background: var(--card); box-shadow: 0 2px 8px rgba(58,50,90,0.08); padding: 12px 4px 10px; }
  #inviteDayGrid .day-card.selected { background: var(--mint-soft); border-color: var(--mint); }
</style>
</head>
<body>

  <div class="phone">
   <div class="screen">
    <div class="header simple">
      <div class="header-title">Invito</div>
    </div>

    <div class="content" id="inviteContent">
      <div class="empty-hint">Caricamento...</div>
    </div>
   </div>

    <!-- Rimane sempre nascosta in questa pagina: appena l'invito viene confermato
         (creando un account, accedendo, o continuando senza login) si viene
         rimandati direttamente alla Home, quindi qui non serve mai mostrarla. -->
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script src="data.js"></script>
  <script>
    (async function () {
      var searchParams = new URLSearchParams(window.location.search);
      var token = searchParams.get('token');
      var contentEl = document.getElementById('inviteContent');

      if (!token) {
        contentEl.innerHTML = '<div class="empty-hint">Link non valido: manca il codice di invito.<br><a href="index.html">Torna alla Home →</a></div>';
        return;
      }

      // Ogni invito è sempre legato a un evento (Fil + Virgi, 2026-07-05): la
      // lista amici non ha più un suo link, serve solo a compilare gli
      // invitati quando l'evento viene creato.
      var event;
      try {
        event = await SeevaData.getEventInviteInfo(token);
      } catch (err) {
        // Fil, 2026-08-23, trovato in un giro di controllo generale: a
        // differenza degli altri due casi di errore qui sotto (token
        // mancante, invito non trovato), questo mostrava il messaggio
        // grezzo del database e non dava nessun modo di uscire — non c'è
        // più la navbar a fare da rete di sicurezza. Stesso trattamento
        // degli altri due.
        contentEl.innerHTML = '<div class="empty-hint">Non riesco a verificare questo invito. Riprova tra poco, o controlla di aver aperto il link giusto.<br><a href="index.html">Torna alla Home →</a></div>';
        return;
      }

      if (!event) {
        contentEl.innerHTML = '<div class="empty-hint">Questo link di invito non esiste (o non è più valido).<br><a href="index.html">Torna alla Home →</a></div>';
        return;
      }

      var eventId = event.id;
      var invitees = (event.invitees || []).map(function (f) {
        return { id: f.id, name: f.name, isClaimed: !!f.claimedAt };
      });

      var ownerLabel = event.createdBy ? event.createdBy : 'Un utente';
      var ownerInitial = ownerLabel ? ownerLabel.trim().charAt(0).toUpperCase() : '🎉';

      /* Mostra una foto (o un'iniziale testuale) dentro un avatar circolare: stessa
         funzione di supporto usata in profilo.html per l'anteprima della foto profilo. */
      function showAvatarImage(el, url) {
        el.innerHTML = '';
        var img = document.createElement('img');
        img.src = url;
        img.style.width = '100%';
        img.style.height = '100%';
        img.style.objectFit = 'cover';
        img.style.borderRadius = '50%';
        el.appendChild(img);
      }

      /* ---------- passo 0: schermata di benvenuto (Fil, 2026-07-19) ----------
         Solo per chi apre un link di invito senza avere già un account su
         questo telefono: prima di chiedergli qualsiasi cosa, si presenta
         l'app (finora il nome "seeva" non compariva mai in questa pagina)
         e si spiega perché vale la pena continuare (gratis, niente
         pubblicità). Chi ha già un account salta dritto alla scelta del
         nome: la conosce già, non ha senso ripresentargliela ogni volta che
         apre un invito. Niente "vista una volta sola" con localStorage qui
         (a differenza dei fumetti hint): è legata al link specifico appena
         aperto, non a un concetto da spiegare una volta per tutte. */
      function renderWelcome() {
        contentEl.innerHTML = ''
          + '<div style="text-align:center; padding:14px 6px 4px;">'
          + '<div style="margin-bottom:14px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="38" height="38"><path d="M12 3.5l2.1 4.6 5 .5-3.8 3.4 1.1 5-4.4-2.6-4.4 2.6 1.1-5-3.8-3.4 5-.5z"></path></svg></div>'
          + '<div style="font-family:\'Fraunces\',serif; font-weight:700; font-size:12.5px; letter-spacing:0.06em; color:var(--peach); text-transform:uppercase; margin-bottom:14px;">seeva</div>'
          + '<div style="font-family:\'Fraunces\',serif; font-weight:600; font-size:19px; line-height:1.35; margin-bottom:14px;">'
          + SeevaData.escapeHTML(ownerLabel) + ' ti ha invitato a<br>"' + SeevaData.escapeHTML(event.name) + '"'
          + '</div>'
          + '<div style="font-size:13.5px; line-height:1.55; color:var(--lavender-ink); margin-bottom:22px; padding:0 6px;">seeva è una nuova app per organizzare eventi con gli amici senza i mille messaggi nel gruppo: rispondi con due tap quando puoi, gratis, senza pubblicità.</div>'
          + '<button type="button" class="primary-btn" id="welcomeContinueBtn">Scopri l\'evento →</button>'
          + '</div>';

        if (window.SeevaUI) window.SeevaUI.refresh();

        document.getElementById('welcomeContinueBtn').addEventListener('click', renderSelection);
      }

      /* ---------- passo 1: "chi sei tra questi?" ----------
         Un solo link per tutta la lista: chi lo apre sceglie quale dei nomi
         (messi dal creatore della lista) è lui. I nomi già confermati da
         qualcun altro restano visibili ma non selezionabili. La card in alto
         riprende lo stesso stile "floating" dell'avatar+nome della Home, per
         essere coerente col resto dell'app invece di un semplice paragrafo. */
      function renderSelection() {
        var rows = invitees.map(function (f) {
          // "Confermato" qui NON voleva dire "viene all'evento" ma solo "nome
          // già collegato a un account" -> confondeva (segnalazione
          // 2026-10-03: "risulta confermato ma non ho mai confermato").
          // Ora lo diciamo chiaro e, se sei tu, ti portiamo ad accedere.
          if (f.isClaimed) {
            return ''
              + '<div class="settings-row" data-claimed-friend="' + f.id + '" style="cursor:pointer; opacity:0.7;">'
              + '<div class="left">' + SeevaData.escapeHTML(f.name) + ' <span class="badge">Ha già un account</span></div>'
              + '<div style="color:var(--ink-soft);">Sei tu? →</div>'
              + '</div>';
          }
          return ''
            + '<div class="settings-row reveal" data-select-friend="' + f.id + '" style="cursor:pointer;">'
            + '<div class="left">' + SeevaData.escapeHTML(f.name) + '</div>'
            + '<div style="color:var(--ink-soft);">Sono io →</div>'
            + '</div>';
        }).join('');

        var anySelectable = invitees.some(function (f) { return !f.isClaimed; });

        // "Aggiungimi" solo se l'organizzatore ha acceso "chiunque col link
        // può aggiungersi" in crea.html (Fil, 2026-07-07): senza, chi non è
        // stato messo in lista non ha modo di entrare da qui.
        var addSelfRow = event.openInvite
          ? '<div class="settings-row reveal" id="addSelfRow" style="cursor:pointer; opacity:0.85;">'
            + '<div class="left">Il mio nome non c\'è</div>'
            + '<div style="color:var(--ink-soft);">Aggiungimi →</div>'
            + '</div>'
          : '';

        contentEl.innerHTML = ''
          + '<div class="header" style="margin:0 0 18px;">'
          + '<div class="profile">'
          + '<div class="avatar">' + SeevaData.escapeHTML(ownerInitial) + '</div>'
          + '<div class="greeting">'
          + '<div class="name">' + SeevaData.escapeHTML(ownerLabel) + '</div>'
          + '<div class="date">ti ha invitato all\'evento "' + SeevaData.escapeHTML(event.name) + '"</div>'
          + '</div>'
          + '</div>'
          + '</div>'
          + '<div class="card-date" style="margin:0 2px 16px;">Scegli chi sei tra questi nomi.</div>'
          + rows
          + addSelfRow
          + (anySelectable || event.openInvite ? '' : '<div class="empty-hint">Tutti i nomi di questo invito sono già collegati a un account: se sei uno di loro, accedi.<br><a href="index.html">Vai alla Home →</a></div>');

        if (window.SeevaUI) window.SeevaUI.refresh();

        contentEl.querySelectorAll('[data-select-friend]').forEach(function (row) {
          row.addEventListener('click', function () {
            var friendId = row.getAttribute('data-select-friend');
            var friend = invitees.filter(function (f) { return f.id === friendId; })[0];
            if (friend) renderConfirm(friend);
          });
        });

        contentEl.querySelectorAll('[data-claimed-friend]').forEach(function (row) {
          row.addEventListener('click', function () {
            if (SeevaData.hasAccount()) { window.location.href = 'evento.html?id=' + encodeURIComponent(eventId); return; }
            renderClaimedLogin();
          });
        });

        var addSelfRowEl = document.getElementById('addSelfRow');
        if (addSelfRowEl) addSelfRowEl.addEventListener('click', renderNameEntry);
      }

      /* Nome già collegato a un account (2026-10-04): chi lo tocca senza
         essere loggato su questo telefono deve solo accedere -- l'evento lo
         trova poi nella sua Home. Nessuna risposta viene data a suo nome. */
      function renderClaimedLogin() {
        contentEl.innerHTML = ''
          + '<div class="card-date" style="margin:0 2px 16px;">Questo nome è già collegato a un account seeva. Non vuol dire che hai già risposto: se sei tu, accedi e troverai l\'evento nella tua Home per rispondere.</div>'
          + '<a class="primary-btn" href="profilo.html?mode=login" style="display:block; text-align:center; text-decoration:none;">Accedi →</a>'
          + '<div class="signup-skip-link" id="claimedBackLink">← Torna alla lista</div>';
        if (window.SeevaUI) window.SeevaUI.refresh();
        document.getElementById('claimedBackLink').addEventListener('click', renderSelection);
      }

      /* ---------- passo 1bis: "il mio nome non c'è" ----------
         Solo su eventi con invito aperto. Chiede il nome, poi prosegue nello
         stesso renderConfirm() usato per un invitato già in lista: la sola
         differenza è che friend.id resta null, e confirmClaim() lo usa per
         scegliere addSelfAsInvitee() invece di claimEventInvitee(). */
      function renderNameEntry() {
        contentEl.innerHTML = ''
          + '<div class="card-date" style="margin:0 2px 16px;">Come ti chiami?</div>'
          + '<div class="field"><input type="text" id="selfNameInput" placeholder="Il tuo nome"></div>'
          + '<div class="form-error" id="selfNameError"></div>'
          + '<button type="button" class="primary-btn" id="selfNameContinueBtn">Continua →</button>'
          + '<div class="signup-skip-link" id="selfNameBackLink">← Torna alla lista</div>';

        if (window.SeevaUI) window.SeevaUI.refresh();

        document.getElementById('selfNameBackLink').addEventListener('click', renderSelection);
        document.getElementById('selfNameContinueBtn').addEventListener('click', function () {
          var typedName = document.getElementById('selfNameInput').value.trim();
          if (!typedName) {
            document.getElementById('selfNameError').textContent = 'Scrivi il tuo nome.';
            return;
          }
          renderConfirm({ id: null, name: typedName });
        });
      }

      /* ---------- passo 2, versione minima (Fil, 2026-09-13, "si può
         semplificare ancora?") ----------
         Solo per eventi aperti a tutti: chi apre un link pubblico e non ha
         già un account su questo telefono salta dritto dal nome al
         Conferma, senza la scelta Accedi/Registrati in mezzo -- chi
         risponde a un invito pubblico vuole farlo in due tap, non valutare
         se registrarsi. "Hai già un account? Accedi" resta disponibile
         come opzione secondaria (apre renderConfirmFull, la schermata
         completa di sempre) per chi lo vuole comunque. Un invito a una
         persona specifica (evento non aperto a tutti) continua a vedere
         la schermata completa come prima -- lì la registrazione ha più
         senso, non arriva da un link girato a chiunque. */
      function renderConfirm(friend) {
        var hasAcc = SeevaData.hasAccount();

        if (!hasAcc && event.openInvite) {
          contentEl.innerHTML = ''
            + '<div class="card-date" style="margin:0 2px 16px;">Hai scelto <b>' + SeevaData.escapeHTML(friend.name) + '</b>.</div>'
            + '<div class="field"><label>Come ti chiami?</label><input type="text" id="guestNameInput" placeholder="Il tuo nome" value="' + SeevaData.escapeHTML(friend.name) + '"></div>'
            + '<div class="form-error" id="inviteError"></div>'
            + '<button type="button" class="primary-btn" id="inviteConfirmBtn">Conferma →</button>'
            + '<div style="text-align:center; margin-top:4px;"><span class="signup-skip-link" id="hasAccountLink">Hai già un account? Accedi</span></div>'
            + '<div class="signup-skip-link" id="backLink">← Scegli un altro nome</div>';

          if (window.SeevaUI) window.SeevaUI.refresh();

          document.getElementById('backLink').addEventListener('click', renderSelection);
          document.getElementById('hasAccountLink').addEventListener('click', function () { renderConfirmFull(friend); });
          document.getElementById('inviteConfirmBtn').addEventListener('click', function () {
            var btn = this;
            var errorEl = document.getElementById('inviteError');
            var name = document.getElementById('guestNameInput').value.trim();
            errorEl.textContent = '';
            if (!name) { errorEl.textContent = 'Scrivi il tuo nome.'; return; }
            confirmClaim(friend, name, null, btn);
          });
          return;
        }

        renderConfirmFull(friend);
      }

      /* ---------- passo 2 completo: accedi / registrati / senza login (Fil,
         2026-07-05; invariata -- resta la schermata per chi non ha un
         account su un invito a persona specifica, o per chi sceglie
         "Accedi" dalla versione minima qui sopra) ---------- */
      function renderConfirmFull(friend) {
        var hasAcc = SeevaData.hasAccount();
        var existingGuestName = SeevaData.getGuestName() || '';

        if (hasAcc) {
          contentEl.innerHTML = ''
            + '<div class="card-date" style="margin:0 2px 16px;">Hai scelto <b>' + SeevaData.escapeHTML(friend.name) + '</b>. Sei registrato come <b>' + SeevaData.escapeHTML(existingGuestName) + '</b>: verrai aggiunto alla lista con questo nome.</div>'
            + '<div class="form-error" id="inviteError"></div>'
            + '<button type="button" class="primary-btn" id="inviteConfirmBtn">Conferma →</button>'
            + '<div class="signup-skip-link" id="backLink">← Scegli un altro nome</div>';

          document.getElementById('backLink').addEventListener('click', renderSelection);
          document.getElementById('inviteConfirmBtn').addEventListener('click', function () {
            confirmClaim(friend, null, SeevaData.getAccount().id, this);
          });
          return;
        }

        /* "Accedi" / "Registrati" sono i due pulsanti grandi in evidenza; "Senza
           login" è solo testo piccolo e centrato tra i due, non una bollicina,
           apposta per essere meno in vista. La registrazione si apre qui sotto,
           nella stessa pagina: nessuna navigazione verso profilo.html. */
        contentEl.innerHTML = ''
          + '<div class="card-date" style="margin:0 2px 16px;">Hai scelto <b>' + SeevaData.escapeHTML(friend.name) + '</b>. Vuoi accedere con un account già esistente o registrarne uno nuovo?</div>'
          + '<div style="display:flex; gap:10px; margin-bottom:8px;">'
          + '<button type="button" class="primary-btn" id="goLoginBtn" style="flex:1; margin-bottom:0;">Accedi</button>'
          + '<button type="button" class="primary-btn" id="goRegisterBtn" style="flex:1; margin-bottom:0; background:var(--card); color:var(--ink); box-shadow:0 2px 8px rgba(58,50,90,0.06);">Registrati</button>'
          + '</div>'
          + '<div style="text-align:center; margin-bottom:8px;"><span class="signup-skip-link" id="guestModeLink">Senza login</span></div>'
          + '<div class="field-hint" style="text-align:center; margin:0 8px 16px;">Con un profilo ritrovi tutti i tuoi eventi in un posto solo. Senza, resti visibile solo per questo evento.</div>'
          + '<div id="loginPanel">'
          + '<div class="field"><label>Email</label><input type="email" id="loginEmail" placeholder="latua@email.it"></div>'
          + '<div class="field"><label>Password</label><input type="password" id="loginPassword" placeholder="La tua password"></div>'
          + '<div class="field-hint" style="text-align:right; margin-top:-8px;"><a href="#" id="forgotPasswordLink">Password dimenticata?</a></div>'
          + '</div>'
          + '<div id="registerPanel" style="display:none;">'
          + '<div class="profile-header" style="margin-bottom: 14px;">'
          + '<div class="avatar large" id="regAvatar">?</div>'
          + '<label class="field-hint" for="regAvatarFile" style="cursor:pointer; color: var(--lavender-ink); font-weight:600; display:inline-block; margin-top:8px;">Carica una foto</label>'
          + '<input type="file" id="regAvatarFile" accept="image/*" style="display:none;">'
          + '</div>'
          + '<div class="field"><label>Nome</label><input type="text" id="regFirstName" placeholder="Il tuo nome"></div>'
          + '<div class="field"><label>Cognome</label><input type="text" id="regLastName" placeholder="Il tuo cognome"></div>'
          + '<div class="field"><label>Nome utente (visibile a tutti)</label><input type="text" id="regUsername" placeholder="Come vuoi farti chiamare nell\'app"></div>'
          + '<div class="field"><label>Email</label><input type="email" id="regEmail" placeholder="latua@email.it"></div>'
          + '<div class="field"><label>Password</label><input type="password" id="regPassword" placeholder="Scegli una password"></div>'
          + '<div class="field"><label>Data di nascita</label><input type="date" id="regBirthdate"></div>'
          + '</div>'
          + '<div id="guestPanel" style="display:none;">'
          + '<div class="field"><label>Come ti chiami?</label><input type="text" id="guestNameInput" placeholder="Il tuo nome" value="' + SeevaData.escapeHTML(friend.name) + '"></div>'
          + '</div>'
          + '<div class="form-error" id="inviteError"></div>'
          + '<button type="button" class="primary-btn" id="inviteConfirmBtn">Conferma →</button>'
          + '<div class="signup-skip-link" id="backLink">← Scegli un altro nome</div>';

        if (window.SeevaUI) window.SeevaUI.refresh();

        var activeMode = 'login';
        var pendingAvatarFile = null;

        var goLoginBtn = document.getElementById('goLoginBtn');
        var goRegisterBtn = document.getElementById('goRegisterBtn');
        var guestModeLink = document.getElementById('guestModeLink');
        var loginPanel = document.getElementById('loginPanel');
        var registerPanel = document.getElementById('registerPanel');
        var guestPanel = document.getElementById('guestPanel');
        var confirmBtn = document.getElementById('inviteConfirmBtn');

        var regAvatarEl = document.getElementById('regAvatar');
        var regFirstNameInput = document.getElementById('regFirstName');
        var regUsernameInput = document.getElementById('regUsername');

        function updateRegAvatarPreview() {
          if (regAvatarEl.querySelector('img')) return;
          var source = regUsernameInput.value.trim() || regFirstNameInput.value.trim();
          regAvatarEl.textContent = source ? source.charAt(0).toUpperCase() : '?';
        }
        regUsernameInput.addEventListener('input', updateRegAvatarPreview);
        regFirstNameInput.addEventListener('input', updateRegAvatarPreview);

        document.getElementById('regAvatarFile').addEventListener('change', function (e) {
          var file = e.target.files && e.target.files[0];
          if (!file) return;
          pendingAvatarFile = file;

          var reader = new FileReader();
          reader.onload = function (ev) {
            showAvatarImage(regAvatarEl, ev.target.result);
          };
          reader.readAsDataURL(file);
        });

        function hideAllPanels() {
          loginPanel.style.display = 'none';
          registerPanel.style.display = 'none';
          guestPanel.style.display = 'none';
          document.getElementById('inviteError').textContent = '';
        }

        function setConfirmLabel() {
          confirmBtn.textContent = 'Conferma →';
        }

        function showLoginPanel() {
          activeMode = 'login';
          hideAllPanels();
          loginPanel.style.display = '';
          setConfirmLabel();
        }

        function showRegisterPanel() {
          activeMode = 'register';
          hideAllPanels();
          registerPanel.style.display = '';
          setConfirmLabel();
        }

        function showGuestPanel() {
          activeMode = 'guest';
          hideAllPanels();
          guestPanel.style.display = '';
          setConfirmLabel();
        }

        goLoginBtn.addEventListener('click', showLoginPanel);
        goRegisterBtn.addEventListener('click', showRegisterPanel);
        guestModeLink.addEventListener('click', showGuestPanel);

        document.getElementById('backLink').addEventListener('click', renderSelection);

        /* Stesso "Password dimenticata?" di profilo.html: manda l'email di
           reset all'indirizzo scritto qui sopra, senza mai rivelare se quella
           email esiste davvero nell'app. */
        var forgotPasswordLink = document.getElementById('forgotPasswordLink');
        forgotPasswordLink.addEventListener('click', async function (e) {
          e.preventDefault();
          var errorEl = document.getElementById('inviteError');
          var email = document.getElementById('loginEmail').value.trim();
          errorEl.textContent = '';
          if (!email) {
            errorEl.textContent = 'Scrivi prima la tua email qui sopra, poi premi di nuovo "Password dimenticata?".';
            return;
          }

          var originalText = forgotPasswordLink.textContent;
          forgotPasswordLink.textContent = 'Invio...';
          try {
            await SeevaData.requestPasswordReset(email);
          } catch (err) {
            errorEl.textContent = 'Non sono riuscito a inviare la richiesta (' + SeevaData.friendlyErrorMessage(err) + '). Riprova.';
            forgotPasswordLink.textContent = originalText;
            return;
          }
          forgotPasswordLink.textContent = originalText;

          if (window.SeevaUI) {
            window.SeevaUI.toast('Se quell\'indirizzo esiste, ti abbiamo mandato un\'email col link per scegliere una nuova password.');
          } else {
            window.alert('Se quell\'indirizzo esiste, ti abbiamo mandato un\'email col link per scegliere una nuova password.');
          }
        });

        confirmBtn.addEventListener('click', async function () {
          var btn = this;
          var errorEl = document.getElementById('inviteError');
          errorEl.textContent = '';

          if (activeMode === 'login') {
            var email = document.getElementById('loginEmail').value.trim();
            var password = document.getElementById('loginPassword').value;
            if (!email || !password) {
              errorEl.textContent = 'Scrivi email e password.';
              return;
            }

            btn.disabled = true;
            btn.textContent = 'Accesso...';
            var account;
            try {
              account = await SeevaData.loginAccount(email, password);
            } catch (err) {
              errorEl.textContent = SeevaData.friendlyErrorMessage(err);
              btn.disabled = false;
              btn.textContent = 'Conferma →';
              return;
            }
            confirmClaim(friend, null, account.id, btn);
            return;
          }

          if (activeMode === 'register') {
            var firstName = document.getElementById('regFirstName').value.trim();
            var lastName = document.getElementById('regLastName').value.trim();
            var regUsername = regUsernameInput.value.trim();
            var email = document.getElementById('regEmail').value.trim();
            var regPassword = document.getElementById('regPassword').value;
            var birthDate = document.getElementById('regBirthdate').value;

            if (!firstName) { errorEl.textContent = 'Scrivi il tuo nome.'; return; }
            if (!lastName) { errorEl.textContent = 'Scrivi il tuo cognome.'; return; }
            if (!regUsername) { errorEl.textContent = 'Scegli un nome utente.'; return; }
            if (!email) { errorEl.textContent = 'Scrivi la tua email.'; return; }
            if (!regPassword) { errorEl.textContent = 'Scegli una password.'; return; }
            if (!birthDate) { errorEl.textContent = 'Inserisci la tua data di nascita.'; return; }

            btn.disabled = true;
            btn.textContent = 'Creo il profilo...';

            var newAccount;
            try {
              var avatarUrl;
              if (pendingAvatarFile) {
                btn.textContent = 'Carico la foto...';
                avatarUrl = await SeevaData.uploadAvatar(pendingAvatarFile);
                btn.textContent = 'Creo il profilo...';
              }
              newAccount = await SeevaData.createAccount({
                firstName: firstName,
                lastName: lastName,
                username: regUsername,
                email: email,
                password: regPassword,
                birthDate: birthDate,
                avatarUrl: avatarUrl
              });
            } catch (err) {
              errorEl.textContent = SeevaData.friendlyErrorMessage(err);
              btn.disabled = false;
              btn.textContent = 'Conferma →';
              return;
            }

            confirmClaim(friend, null, newAccount.id, btn);
            return;
          }

          var name = document.getElementById('guestNameInput').value.trim();
          if (!name) {
            errorEl.textContent = 'Scrivi il tuo nome.';
            return;
          }
          confirmClaim(friend, name, null, btn);
        });
      }

      /* ================================================================
         "Rispondi prima, registrati dopo" (Fil + Virgi, 2026-10-25)
         ================================================================
         Prima chi apriva il link senza account faceva 4 passaggi prima di
         poter rispondere (benvenuto -> scegli il nome -> accedi/registrati/
         senza login -> evento). Ora, come Partiful / Apple Invites / Doodle:
         1) vede subito l'evento con i pulsanti per rispondere;
         2) tocca la risposta, poi solo "chi sei?" (il suo nome in lista);
         3) risposta salvata, schermata "Fatto!" con la proposta di crearsi
            un profilo (facoltativa: se lo crea su questo telefono, le
            risposte da ospite passano al suo account, vedi
            adoptGuestAnswers in data.js).
         Chi ha già un account su questo telefono resta sul percorso di
         prima (renderSelection). "Hai già un account? Accedi" porta lì. */
      var pendingAnswer = null; // { kind: 'yes'|'maybe'|'no'|'dates', ids: [...] }

      function sortedDateOptions() {
        return (event.dateOptions || []).slice().sort(function (a, b) {
          return a.dateISO < b.dateISO ? -1 : (a.dateISO > b.dateISO ? 1 : 0);
        });
      }

      function tr(it, vars) {
        return (typeof window.t === 'function') ? window.t(it, vars) : it.replace(/\{(\w+)\}/g, function (m, k) { return vars && vars[k] != null ? vars[k] : m; });
      }

      function inviteHeaderHTML(info) {
        var photoHTML = event.photoUrl
          ? '<img src="' + SeevaData.escapeHTML(event.photoUrl) + '" alt="" decoding="async" style="width:100%; height:150px; object-fit:cover; border-radius:18px; margin-bottom:14px;">'
          : '';
        var dates = sortedDateOptions();
        var whenLabel;
        if (info.bestOption && (info.status === 'done' || info.status === 'passato')) {
          whenLabel = SeevaData.formatDateTimeLabel(info.bestOption.dateISO, event.eventTime);
        } else if (dates.length === 1) {
          whenLabel = SeevaData.formatDateTimeLabel(dates[0].dateISO, event.eventTime);
        } else if (dates.length > 1) {
          whenLabel = tr('Da decidere tra {n} date', { n: dates.length });
        } else {
          whenLabel = '';
        }
        var place = event.locationAddress || '';
        var goingNames = (event.participants || []).filter(function (p) {
          return (p.availableDateOptionIds || []).length > 0;
        }).map(function (p) { return p.name; });
        var goingHTML = goingNames.length
          ? '<div class="card-date" style="margin:10px 2px 0;">' + SeevaData.escapeHTML(tr('Ci saranno: {names}', { names: goingNames.slice(0, 6).join(', ') + (goingNames.length > 6 ? ' +' + (goingNames.length - 6) : '') })) + '</div>'
          : '';
        var desc = (event.description || '').trim();
        var descHTML = desc
          ? '<div data-no-i18n style="font-size:14px; line-height:1.5; color:var(--ink-soft); margin-top:10px; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;">' + SeevaData.escapeHTML(desc) + '</div>'
          : '';
        return ''
          + '<div style="font-size:13.5px; color:var(--ink-soft); margin:0 2px 10px;">' + SeevaData.escapeHTML(tr('{name} ti ha invitato', { name: ownerLabel })) + '</div>'
          + photoHTML
          + '<div data-no-i18n style="font-family:\'Fraunces\',serif; font-weight:700; font-size:24px; line-height:1.25; margin:0 2px 12px;">' + SeevaData.escapeHTML(event.name) + '</div>'
          + '<div class="settings-row" style="cursor:default; margin-bottom:8px;"><div class="left">📅 ' + SeevaData.escapeHTML(whenLabel) + '</div></div>'
          + (place ? '<div class="settings-row" style="cursor:default; margin-bottom:8px;"><div class="left" data-no-i18n>📍 ' + SeevaData.escapeHTML(place) + '</div></div>' : '')
          + descHTML
          + goingHTML;
      }

      function renderInvite() {
        var info = SeevaData.computeEventStatus(event);
        var dates = sortedDateOptions();
        var bodyHTML = '';
        var mode = 'none';

        if (info.status === 'cancelled') {
          bodyHTML = '<div class="empty-hint" style="margin-top:18px;">Questo evento è stato annullato.</div>';
        } else if (info.status === 'passato') {
          bodyHTML = '<div class="empty-hint" style="margin-top:18px;">Questo evento è già passato.</div>';
        } else if (info.status === 'done' && info.bestOption) {
          mode = 'rsvp';
        } else if (dates.length === 1) {
          mode = 'rsvp';
        } else if (dates.length > 1 && (info.status === 'waiting' || info.status === 'almost')) {
          mode = 'vote';
        } else {
          // pareggio / l'organizzatore deve scegliere: si entra e basta
          mode = 'enter';
        }

        if (mode === 'rsvp') {
          bodyHTML = ''
            + '<div class="section-title" style="margin-top:22px;">Ci sarai?</div>'
            + '<div class="rsvp-seg" style="flex-direction:column; gap:10px;">'
            + '<button type="button" class="rsvp-seg-btn is-yes is-active" data-answer="yes" style="min-height:54px; font-size:16px;">Ci sono</button>'
            + '<div style="display:flex; gap:10px;">'
            + '<button type="button" class="rsvp-seg-btn is-maybe" data-answer="maybe" style="min-height:50px; font-size:15px;">Forse</button>'
            + '<button type="button" class="rsvp-seg-btn is-no" data-answer="no" style="min-height:50px; font-size:15px;">Non ci sono</button>'
            + '</div>'
            + '</div>';
        } else if (mode === 'vote') {
          var cards = dates.map(function (opt) {
            var p = SeevaData.dayParts(opt.dateISO);
            var mon = p.mon ? p.mon.charAt(0).toUpperCase() + p.mon.slice(1) : '';
            return '<div class="chip day-card" data-option-id="' + opt.id + '">'
              + '<div class="day-dow">' + SeevaData.escapeHTML(p.dow) + '</div>'
              + '<div class="day-num">' + SeevaData.escapeHTML(String(p.day)) + '</div>'
              + '<div class="day-month">' + SeevaData.escapeHTML(mon) + '</div>'
              + '<div class="chip-check">✓</div>'
              + '</div>';
          }).join('');
          var deadline = info.voteDeadlineLabel ? '<div class="field-hint" style="margin:-4px 2px 10px;">' + SeevaData.escapeHTML(tr('Si vota fino a {when}', { when: info.voteDeadlineLabel })) + '</div>' : '';
          bodyHTML = ''
            + '<div class="section-title" style="margin-top:22px;">Quando puoi?</div>'
            + '<div class="card-date" style="margin:0 2px 10px;">Tocca tutti i giorni in cui puoi venire.</div>'
            + deadline
            + '<div class="day-grid" id="inviteDayGrid">' + cards + '</div>'
            + '<div class="form-error" id="voteError"></div>'
            + '<button type="button" class="primary-btn" id="voteSendBtn">Invia →</button>'
            + '<div style="text-align:center;"><span class="signup-skip-link" id="voteNoneLink">Non posso in nessuno di questi giorni</span></div>';
        } else if (mode === 'enter') {
          bodyHTML = ''
            + '<div class="card-date" style="margin:18px 2px 12px;">L\'organizzatore sta scegliendo la data.</div>'
            + '<button type="button" class="primary-btn" id="inviteEnterBtn">Entra nell\'evento →</button>';
        }

        contentEl.innerHTML = ''
          + inviteHeaderHTML(info)
          + bodyHTML
          + '<div style="text-align:center; margin-top:14px;"><span class="signup-skip-link" id="inviteLoginLink">Hai già un account? Accedi</span></div>';

        if (window.SeevaUI) window.SeevaUI.refresh();

        document.getElementById('inviteLoginLink').addEventListener('click', renderSelection);

        contentEl.querySelectorAll('[data-answer]').forEach(function (b) {
          b.addEventListener('click', function () {
            var key = b.getAttribute('data-answer');
            var optId = (info.status === 'done' && info.bestOption) ? info.bestOption.id : dates[0].id;
            pendingAnswer = key === 'yes' ? { kind: 'yes', ids: [optId] } : { kind: key, ids: [] };
            renderWho();
          });
        });

        var grid = document.getElementById('inviteDayGrid');
        if (grid) {
          grid.querySelectorAll('.chip').forEach(function (chip) {
            chip.addEventListener('click', function () {
              chip.classList.toggle('selected');
              document.getElementById('voteError').textContent = '';
            });
          });
          document.getElementById('voteSendBtn').addEventListener('click', function () {
            var ids = Array.prototype.map.call(grid.querySelectorAll('.chip.selected'), function (c) { return c.getAttribute('data-option-id'); });
            if (!ids.length) {
              document.getElementById('voteError').textContent = 'Tocca almeno un giorno, oppure "Non posso in nessuno di questi giorni".';
              return;
            }
            pendingAnswer = { kind: 'dates', ids: ids };
            renderWho();
          });
          document.getElementById('voteNoneLink').addEventListener('click', function () {
            pendingAnswer = { kind: 'no', ids: [] };
            renderWho();
          });
        }

        var enterBtn = document.getElementById('inviteEnterBtn');
        if (enterBtn) enterBtn.addEventListener('click', function () {
          pendingAnswer = null;
          renderWho();
        });
      }

      /* "Chi sei?": i nomi messi dall'organizzatore ancora liberi, più
         (solo su invito aperto) "Il mio nome non c'è". I nomi già collegati
         a un account non si mostrano come scelte: per quelli c'è il link
         "Accedi" in fondo. */
      function renderWho() {
        var free = invitees.filter(function (f) { return !f.isClaimed; });
        var anyClaimed = invitees.some(function (f) { return f.isClaimed; });

        var rows = free.map(function (f) {
          return ''
            + '<div class="settings-row reveal" data-who="' + f.id + '" style="cursor:pointer; min-height:52px;">'
            + '<div class="left" data-no-i18n style="font-size:16px;">' + SeevaData.escapeHTML(f.name) + '</div>'
            + '<div style="color:var(--ink-soft);">Sono io →</div>'
            + '</div>';
        }).join('');

        var selfHTML = event.openInvite
          ? ''
            + '<div class="field" style="margin-top:' + (free.length ? '18px' : '0') + ';">'
            + (free.length ? '<label>Il mio nome non c\'è</label>' : '')
            + '<input type="text" id="whoNameInput" placeholder="Il tuo nome" autocomplete="given-name"></div>'
            + '<button type="button" class="primary-btn" id="whoNameBtn">Conferma →</button>'
          : '';

        var emptyHTML = (!free.length && !event.openInvite)
          ? '<div class="empty-hint">Tutti i nomi di questo invito sono già collegati a un account: se sei uno di loro, accedi.</div>'
            + '<a class="primary-btn" href="profilo.html?mode=login" style="display:block; text-align:center; text-decoration:none;">Accedi →</a>'
          : '';

        contentEl.innerHTML = ''
          + '<div class="section-title" style="margin-top:4px;">Ultimo passo: chi sei?</div>'
          + '<div class="card-date" style="margin:0 2px 14px;">' + (free.length ? 'Tocca il tuo nome.' : 'Scrivi il tuo nome, così gli altri sanno chi sei.') + '</div>'
          + rows
          + selfHTML
          + emptyHTML
          + '<div class="form-error" id="inviteError"></div>'
          + (anyClaimed && (free.length || event.openInvite) ? '<div style="text-align:center; margin-top:10px;"><span class="signup-skip-link" id="whoLoginLink">Il tuo nome ha già un account? Accedi</span></div>' : '')
          + '<div class="signup-skip-link" id="whoBackLink">← Torna all\'invito</div>';

        if (window.SeevaUI) window.SeevaUI.refresh();

        document.getElementById('whoBackLink').addEventListener('click', renderInvite);
        var loginLink = document.getElementById('whoLoginLink');
        if (loginLink) loginLink.addEventListener('click', renderSelection);

        contentEl.querySelectorAll('[data-who]').forEach(function (row) {
          row.addEventListener('click', function () {
            var f = invitees.filter(function (x) { return x.id === row.getAttribute('data-who'); })[0];
            if (f) saveGuestAnswer(f, f.name, row);
          });
        });

        var nameBtn = document.getElementById('whoNameBtn');
        if (nameBtn) nameBtn.addEventListener('click', function () {
          var typed = document.getElementById('whoNameInput').value.trim();
          if (!typed) { document.getElementById('inviteError').textContent = 'Scrivi il tuo nome.'; return; }
          // Se il nome scritto è proprio uno di quelli in lista, si usa quello
          // (evita l'errore "c'è già un invitato con questo nome").
          var match = free.filter(function (x) { return (x.name || '').trim().toLowerCase() === typed.toLowerCase(); })[0];
          saveGuestAnswer(match || { id: null, name: typed }, typed, nameBtn);
        });
      }

      var savingGuest = false;
      async function saveGuestAnswer(friend, name, el) {
        if (savingGuest) return;
        savingGuest = true;
        var errorEl = document.getElementById('inviteError');
        if (errorEl) errorEl.textContent = '';
        if (el) el.style.opacity = '0.6';

        var result;
        try {
          result = friend.id
            ? await SeevaData.claimEventInvitee(token, friend.id, name, null)
            : await SeevaData.addSelfAsInvitee(token, name, null);
        } catch (err) {
          savingGuest = false;
          if (el) el.style.opacity = '';
          if (errorEl) errorEl.textContent = SeevaData.friendlyErrorMessage(err);
          return;
        }

        var finalName = (result && result.name) || name;
        SeevaData.setGuestName(finalName);
        SeevaData.addGuestEventLock(eventId);

        if (!pendingAnswer) {
          window.location.href = 'evento.html?id=' + encodeURIComponent(eventId);
          return;
        }

        try {
          await SeevaData.upsertParticipant(eventId, finalName, pendingAnswer.ids, [], undefined, pendingAnswer.kind === 'maybe');
        } catch (err) {
          // Il nome è salvato, la risposta no: si va sull'evento a ridarla.
          try { sessionStorage.setItem('seeva:toast', 'Non sono riuscito a salvare la risposta: ridalla qui sotto.'); } catch (e) { /* ignora */ }
          window.location.href = 'evento.html?id=' + encodeURIComponent(eventId);
          return;
        }
        renderDone(finalName);
      }

      function renderDone(finalName) {
        var a = pendingAnswer || {};
        var answerLine;
        if (a.kind === 'yes') answerLine = tr('Hai risposto: {answer}', { answer: tr('Ci sono') });
        else if (a.kind === 'maybe') answerLine = tr('Hai risposto: {answer}', { answer: tr('Forse') });
        else if (a.kind === 'no') answerLine = tr('Hai risposto: {answer}', { answer: tr('Non ci sono') });
        else if (a.kind === 'dates') answerLine = a.ids.length === 1 ? tr('Hai segnato 1 giorno') : tr('Hai segnato {n} giorni', { n: a.ids.length });
        else answerLine = '';

        var locNote = ((event.locationOptions || []).length > 1 && a.kind !== 'no')
          ? '<div class="card-date" style="margin:0 2px 14px;">C\'è anche da scegliere il posto: lo trovi nell\'evento.</div>'
          : '';

        contentEl.innerHTML = ''
          + '<div style="text-align:center; padding:18px 6px 6px;">'
          + '<div style="font-size:40px; margin-bottom:6px;">🎉</div>'
          + '<div style="font-family:\'Fraunces\',serif; font-weight:700; font-size:24px; margin-bottom:8px;">Fatto!</div>'
          + '<div style="font-size:15px; margin-bottom:4px;">' + SeevaData.escapeHTML(answerLine) + '</div>'
          + '<div class="card-date" style="margin:0 0 18px;">' + SeevaData.escapeHTML(tr('{owner} lo vede subito. Puoi cambiare idea quando vuoi.', { owner: ownerLabel })) + '</div>'
          + '</div>'
          + locNote
          + '<a class="primary-btn" href="evento.html?id=' + encodeURIComponent(eventId) + '" style="display:block; text-align:center; text-decoration:none;">Vedi l\'evento →</a>'
          + '<div class="share-box" style="text-align:center; margin-top:18px;">'
          + '<div class="share-label" style="margin-bottom:8px;">Vuoi un promemoria il giorno prima?</div>'
          + '<div class="card-date" style="margin:0 0 12px;">Con un profilo gratuito ricevi gli avvisi e ritrovi tutti i tuoi eventi. Ci vuole un minuto, e questa risposta resta tua.</div>'
          + '<a class="primary-btn" href="profilo.html" style="display:block; text-decoration:none; margin-bottom:0; background:var(--card); color:var(--ink); box-shadow:0 2px 8px rgba(58,50,90,0.08);">Crea il profilo</a>'
          + '</div>';

        if (window.SeevaUI) window.SeevaUI.refresh();
        // la stessa proposta in evento.html sarebbe un doppione: già vista qui
        try { localStorage.setItem('seeva:guestAppNudgeSeen', '1'); } catch (err) { /* ignora */ }
      }

      /* ---------- conferma definitiva verso il database ---------- */
      async function confirmClaim(friend, name, accountId, btn) {
        var errorEl = document.getElementById('inviteError');
        btn.disabled = true;
        btn.textContent = 'Confermo...';

        var result;
        try {
          // friend.id nullo = "il mio nome non c'è" (renderNameEntry): non
          // stiamo confermando un invitato già in lista, ne stiamo creando
          // uno nuovo. L'RPC ricontrolla comunque open_invite lato server.
          result = friend.id
            ? await SeevaData.claimEventInvitee(token, friend.id, name, accountId)
            : await SeevaData.addSelfAsInvitee(token, name, accountId);
        } catch (err) {
          errorEl.textContent = SeevaData.friendlyErrorMessage(err);
          btn.disabled = false;
          btn.textContent = 'Conferma →';
          return;
        }

        if (!accountId) {
          SeevaData.setGuestName(name);
          // Ha scelto esplicitamente "senza login": da qui in poi resta
          // confinato solo a questo evento finché non si registra o accede —
          // vedi checkAccessGate in data.js, controllato da tutte le altre
          // pagine dell'app.
          SeevaData.addGuestEventLock(eventId);
        }

        // invece di restare qui, si rimbalza subito sull'evento: il messaggio
        // di conferma appare come un popup dal basso che sparisce da solo
        // (vedi initPendingToast in script.js)
        var toastMessage = 'Sei entrato come ' + result.name + '. Rispondi all\'invito!';
        try { sessionStorage.setItem('seeva:toast', toastMessage); } catch (err) { /* ignora */ }
        window.location.href = 'evento.html?id=' + encodeURIComponent(eventId);
      }

      if (SeevaData.hasAccount()) {
        /* Link nel gruppo (Fil, 2026-10-25): chi ha già un account ed è già
           tra gli invitati va dritto all'evento; se il link è aperto a tutti
           si aggiunge da solo (o prende il suo nome se l'organizzatore
           l'aveva scritto uguale) e va all'evento. Solo negli altri casi
           resta la scelta del nome di prima. */
        var meAcc = SeevaData.getAccount();
        var meLower = String(meAcc.username || '').trim().toLowerCase();
        var rawInv = event.invitees || [];
        var goEvent = function () { window.location.replace('evento.html?id=' + encodeURIComponent(eventId)); };
        if (rawInv.some(function (f) { return f.accountId === meAcc.id; }) || event.createdByAccountId === meAcc.id) { goEvent(); return; }
        if (event.openInvite) {
          contentEl.innerHTML = '<div class="empty-hint">Ti aggiungo all\'evento…</div>';
          try {
            var sameName = rawInv.filter(function (f) { return !f.claimedAt && String(f.name || '').trim().toLowerCase() === meLower; })[0];
            if (sameName) await SeevaData.claimEventInvitee(token, sameName.id, null, meAcc.id);
            else await SeevaData.addSelfAsInvitee(token, null, meAcc.id);
            try { sessionStorage.setItem('seeva:toast', 'Sei dentro ✓ Rispondi qui sotto'); } catch (e) { /* ignora */ }
            goEvent();
            return;
          } catch (err) { /* qualcosa non va: si torna alla scelta del nome */ }
        }
        renderSelection();
      } else {
        // Ospite che su questo telefono è già entrato in QUESTO evento (con
        // la sua risposta): niente da rifare, dritto all'evento.
        var gl = SeevaData.getGuestLock();
        var already = gl && SeevaData.getGuestName() && ((Array.isArray(gl.eventIds) && gl.eventIds.indexOf(eventId) !== -1) || gl.id === eventId);
        if (already) {
          window.location.replace('evento.html?id=' + encodeURIComponent(eventId));
          return;
        }
        // Prima qui c'era renderWelcome() (presentazione dell'app): ora si
        // parte direttamente dall'invito con i pulsanti per rispondere.
        renderInvite();
      }
    })();
  </script>
  <script src="script.js"></script>
</body>
