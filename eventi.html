<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<!-- Niente traduzione automatica di Chrome (Fil, 2026-10-10): l'app ha già italiano/inglese suoi; con l'app in inglese su un telefono italiano Chrome traduceva sopra, mischiando le lingue. -->

<link rel="manifest" href="manifest.json">
<!-- Pagine vicine precaricate in background (Fil, 2026-07-22): quando tocchi la barra in basso il browser le ha gia' scaricate, il salto si sente piu' veloce. Solo un suggerimento (il browser decide lui se/quando farlo, in base a rete e batteria) -- niente da rompere se lo ignora, es. Safari iOS lo supporta poco. -->
<link rel="prefetch" href="index.html">
<link rel="prefetch" href="crea.html">
<link rel="prefetch" href="amici.html">
<link rel="prefetch" href="profilo.html">

<meta name="apple-mobile-web-app-title" content="seeva">
<script>
  /* Fix navbar tagliata sull'app installata (PWA a schermo intero): su alcuni
     Android/Chrome 100dvh non combacia col vero window.innerHeight quando
     l'app gira standalone, e la navbar finisce a metà, sotto la gesture bar.
     Misuriamo noi lo spazio vero e lo passiamo a style.css via --app-height.
     Solo in standalone: in Safari normale (scheda del browser) 100dvh da solo
     si aggiorna già correttamente quando la barra degli indirizzi si nasconde/
     mostra, mentre un innerHeight misurato una volta e aggiornato solo su
     resize/orientationchange restava indietro e lasciava una striscia grigia
     sotto la tab bar (bug notato da Fil su iPhone il 2026-07-05). */
  (function () {
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (!isStandalone) return;
    function setAppHeight() {
      document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
    }
    setAppHeight();
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', setAppHeight);
  })();
</script>
</head>
<body>

  <div class="phone">
   <div class="screen">
    <div class="header simple">
      <div class="header-title" id="eventiTitle">I tuoi eventi</div>
    </div>
    <!-- Fuori dall'header apposta (Fil, 2026-08-22): a.back-btn è
         position:absolute rispetto al primo antenato "position:relative"
         che trova — dentro l'header (alto solo quanto il titolo) finiva
         fuori schermo, qui invece l'antenato utile è .screen (alto quanto
         tutta la pagina), dove va davvero. -->
    <a class="back-btn" href="index.html" id="backBtn" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M15 18l-6-6 6-6"></path></svg></a>

    <div class="content">
      <div class="pill-row">
        <div class="pill active" data-filter="confermati">Confermati</div>
        <div class="pill" data-filter="attesa">In attesa</div>
        <div class="pill" data-filter="annullati">Annullati</div>
        <div class="pill" data-filter="tutti">Tutti</div>
      </div>

      <!-- Sagome grigie finché non ci sono dati (2026-10-26) -->
      <div id="eventsList"><div class="sk-wrap" aria-hidden="true"><div class="sk-card"><div class="sk-row"><span class="sk" style="width:40px;height:40px;border-radius:10px"></span><div class="sk-col"><span class="sk" style="width:62%;height:14px"></span><span class="sk" style="width:40%"></span></div><span class="sk sk-pill" style="width:58px;height:24px"></span></div></div><div class="sk-card"><div class="sk-row"><span class="sk" style="width:40px;height:40px;border-radius:10px"></span><div class="sk-col"><span class="sk" style="width:62%;height:14px"></span><span class="sk" style="width:40%"></span></div><span class="sk sk-pill" style="width:58px;height:24px"></span></div></div><div class="sk-card"><div class="sk-row"><span class="sk" style="width:40px;height:40px;border-radius:10px"></span><div class="sk-col"><span class="sk" style="width:62%;height:14px"></span><span class="sk" style="width:40%"></span></div><span class="sk sk-pill" style="width:58px;height:24px"></span></div></div><div class="sk-card"><div class="sk-row"><span class="sk" style="width:40px;height:40px;border-radius:10px"></span><div class="sk-col"><span class="sk" style="width:62%;height:14px"></span><span class="sk" style="width:40%"></span></div><span class="sk sk-pill" style="width:58px;height:24px"></span></div></div></div></div>
    </div>
   </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script src="data.js"></script>
  <script>
    (async function () {
      /* Stessa regola d'accesso di tutta l'app: senza account, si vede questa
         pagina solo se un lock ti confina qui (mai il caso per Eventi, che
         non è mai il "posto giusto" per un ospite bloccato) — altrimenti la
         schermata "serve un profilo" al posto della lista. */
      var gate = SeevaData.checkAccessGate(null);
      if (gate.action === 'redirect') {
        window.location.href = gate.url;
        return;
      }
      if (gate.action === 'block') {
        document.querySelector('.content').innerHTML = SeevaData.accountRequiredBlockHTML(
          'Per vedere i tuoi eventi devi prima creare un profilo.'
        );
        if (window.SeevaUI) window.SeevaUI.refresh();
        return;
      }

      // 2026-10-26: senza await, la lista salvata si disegna subito (vedi index.html)
      SeevaData.renderSessionWarningIfNeeded();

      /* ---------- Nuova Home (Fil, 2026-10-04) ----------
         Questa pagina ora mostra una delle tre liste "tue" aperte dai
         riquadri della Home: Da rispondere / La tua agenda / Annullati (che
         comprende anche quelli a cui non vai). Smistamento: una sola
         funzione, SeevaData.classifyMyEvents, la stessa dei numeri in Home.
         I vecchi link (?only=attesa, confermati, tutti — notifiche ed email
         già spedite) portano alla lista nuova più vicina. */
      var OLD_TO_NEW = { attesa: 'rispondere', confermati: 'agenda', tutti: 'agenda' };
      var TITLES = { rispondere: 'Da rispondere', agenda: 'Agenda', annullati: 'Annullati e non ci vai' };
      var only = new URLSearchParams(window.location.search).get('only') || 'agenda';
      only = OLD_TO_NEW[only] || only;
      if (!TITLES[only]) only = 'agenda';

      document.getElementById('backBtn').style.display = '';
      var pillRow = document.querySelector('.pill-row');
      if (pillRow) pillRow.style.display = 'none';
      document.getElementById('eventiTitle').textContent = TITLES[only];

      var listEl = document.getElementById('eventsList');
      var events = [];
      var agendaFilter = 'tutti';   // tutti | yes | maybe | decidere
      var showAll = false;          // agenda: oltre la fine dell'anno
      var saving = false;
      var lastListHTML = null;

      // Gli annullati (a mano) si scaricano solo aprendo la loro lista
      // (2026-10-05), e si uniscono a quelli attivi senza doppioni.
      async function loadEvents() {
        var list = await SeevaData.getEvents();
        if (only === 'annullati' && SeevaData.getCancelledEvents) {
          var ids = list.map(function (e) { return e.id; });
          var cancelled = await SeevaData.getCancelledEvents();
          list = list.concat(cancelled.filter(function (e) { return ids.indexOf(e.id) === -1; }));
        }
        events = list;
      }

      function monthTitle(iso) {
        var d = new Date(iso + 'T00:00:00');
        var m = d.toLocaleDateString(window.SeevaI18n ? SeevaI18n.locale() : 'it-IT', { month: 'long' });
        m = m.charAt(0).toUpperCase() + m.slice(1);
        return d.getFullYear() === new Date().getFullYear() ? m : m + ' ' + d.getFullYear();
      }

      function cardsHTML(items, opts) {
        return items.map(function (it) { return SeevaData.renderMyEventCardHTML(it, opts); }).join('');
      }

      /* ---------- Agenda a calendario (Fil, 2026-10-25) ----------
         "Se mi dici agenda mi immagino un calendario, anche per capire
         meglio le date". In alto il mese (frecce per cambiarlo), con un
         pallino sotto ogni giorno in cui hai qualcosa: pieno verde = ci
         sei / organizzi, giallo = forse, vuoto viola = data da decidere
         (su ogni giorno proposto), vuoto arancione = da rispondere. Sotto,
         l'elenco scritto: gli eventi del mese (+ quelli con la data da
         decidere); toccando un giorno, solo quelli di quel giorno. */
      var calMonth = (function () { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
      var calSel = null;
      function isoOf(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
      function futureDatesOf(ev) {
        var today = isoOf(new Date());
        return (ev.dateOptions || []).map(function (o) { return o.dateISO; }).filter(function (d) { return d >= today; });
      }

      function buildAgendaHTML(mine) {
        var loc = window.SeevaI18n ? SeevaI18n.locale() : 'it-IT';
        var marks = {};   // iso -> [kind,...]
        function mark(iso, kind) { if (!iso) return; (marks[iso] = marks[iso] || []).push(kind); }
        mine.agenda.forEach(function (i) { mark(i.dateISO, (i.myKey === 'maybe') ? 'maybe' : 'yes'); });
        mine.undecided.forEach(function (i) { futureDatesOf(i.event).forEach(function (d) { mark(d, 'dec'); }); });
        mine.toAnswer.forEach(function (i) {
          var ds = (i.kind === 'vote') ? futureDatesOf(i.event) : [i.dateISO];
          ds.forEach(function (d) { mark(d, 'ans'); });
        });

        var y = calMonth.getFullYear(), m = calMonth.getMonth();
        var title = calMonth.toLocaleDateString(loc, { month: 'long', year: 'numeric' });
        title = title.charAt(0).toUpperCase() + title.slice(1);
        var first = new Date(y, m, 1);
        var start = new Date(y, m, 1 - ((first.getDay() + 6) % 7)); // lunedì
        var todayISO = isoOf(new Date());
        var cells = '';
        for (var k = 0; k < 42; k++) {
          var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + k);
          if (k === 35 && d.getMonth() !== m) break; // 5 righe bastano
          var iso = isoOf(d);
          var ks = marks[iso] || [];
          var order = ['yes', 'maybe', 'ans', 'dec'];
          var dots = order.filter(function (x) { return ks.indexOf(x) !== -1; }).slice(0, 3).map(function (x) { return '<i class="cal-dot is-' + x + '"></i>'; }).join('');
          cells += '<button type="button" class="cal-day' + (d.getMonth() !== m ? ' is-out' : '') + (iso === todayISO ? ' is-today' : '') + (iso === calSel ? ' is-sel' : '') + (ks.length ? ' has-ev' : '') + '" data-cal-day="' + iso + '">'
            + '<span class="cal-num">' + d.getDate() + '</span><span class="cal-dots">' + dots + '</span></button>';
        }
        var dowNames = [];
        for (var w = 0; w < 7; w++) {
          var dd = new Date(2024, 0, 1 + w); // 1 gen 2024 = lunedì
          dowNames.push(dd.toLocaleDateString(loc, { weekday: 'narrow' }).toUpperCase());
        }
        var html = '<div class="cal">'
          + '<div class="cal-head"><button type="button" class="cal-nav" data-cal-nav="-1" aria-label="Mese prima">‹</button>'
          + '<div class="cal-title">' + SeevaData.escapeHTML(title) + '</div>'
          + '<button type="button" class="cal-nav" data-cal-nav="1" aria-label="Mese dopo">›</button></div>'
          + '<div class="cal-dow">' + dowNames.map(function (n) { return '<span>' + n + '</span>'; }).join('') + '</div>'
          + '<div class="cal-grid">' + cells + '</div>'
          + '<div class="cal-legend"><span><i class="cal-dot is-yes"></i>Ci sono</span><span><i class="cal-dot is-maybe"></i>Forse</span><span><i class="cal-dot is-dec"></i>Da decidere</span><span><i class="cal-dot is-ans"></i>Da rispondere</span></div>'
          + '</div>';

        var listHTML = '';
        if (calSel) {
          var dayTitle = new Date(calSel + 'T00:00:00').toLocaleDateString(loc, { weekday: 'long', day: 'numeric', month: 'long' });
          dayTitle = dayTitle.charAt(0).toUpperCase() + dayTitle.slice(1);
          var dayItems = mine.agenda.filter(function (i) { return i.dateISO === calSel; }).map(function (i) { return SeevaData.renderMyEventCardHTML(i); });
          mine.toAnswer.forEach(function (i) {
            var ds = (i.kind === 'vote') ? futureDatesOf(i.event) : [i.dateISO];
            if (ds.indexOf(calSel) !== -1) dayItems.push(SeevaData.renderMyEventCardHTML(i, { actions: true }));
          });
          mine.undecided.forEach(function (i) { if (futureDatesOf(i.event).indexOf(calSel) !== -1) dayItems.push(SeevaData.renderMyEventCardHTML(i)); });
          listHTML += '<div class="agenda-group-title">' + SeevaData.escapeHTML(dayTitle) + '</div>'
            + (dayItems.length ? dayItems.join('') : '<div class="empty-hint" style="padding:14px 0;">Niente in programma questo giorno.<br><a href="crea.html">Crea un evento →</a></div>');
        } else {
          var mm = ('0' + (m + 1)).slice(-2);
          var prefix = y + '-' + mm;
          var monthItems = mine.agenda.filter(function (i) { return (i.dateISO || '').slice(0, 7) === prefix; });
          var monthName = calMonth.toLocaleDateString(loc, { month: 'long' });
          monthName = monthName.charAt(0).toUpperCase() + monthName.slice(1);
          listHTML += '<div class="agenda-group-title">' + SeevaData.escapeHTML(monthName) + '</div>'
            + (monthItems.length ? monthItems.map(function (i) { return SeevaData.renderMyEventCardHTML(i); }).join('') : '<div class="empty-hint" style="padding:10px 0 4px;">Niente di confermato questo mese.</div>');
          if (mine.undecided.length) {
            listHTML += '<div class="agenda-group-title">Data da decidere</div>' + mine.undecided.map(function (i) { return SeevaData.renderMyEventCardHTML(i); }).join('');
          }
        }
        html += '<div class="cal-list">' + listHTML + '</div>';
        html += '<div class="agenda-foot">Gli eventi passati restano nel tuo Profilo.</div>';
        return html;
      }

      listEl.addEventListener('click', function (e) {
        var nav = e.target.closest && e.target.closest('[data-cal-nav]');
        if (nav) {
          calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + parseInt(nav.getAttribute('data-cal-nav'), 10), 1);
          calSel = null;
          render();
          return;
        }
        var day = e.target.closest && e.target.closest('[data-cal-day]');
        if (day) {
          var iso = day.getAttribute('data-cal-day');
          calSel = (calSel === iso) ? null : iso;
          var dd = new Date(iso + 'T00:00:00');
          if (dd.getMonth() !== calMonth.getMonth()) calMonth = new Date(dd.getFullYear(), dd.getMonth(), 1);
          render();
        }
      });

      function render() {
        var mine = SeevaData.classifyMyEvents(events);
        var newHTML;
        if (only === 'rispondere') {
          newHTML = mine.toAnswer.length
            ? '<div class="list-hint">I più urgenti prima.</div>' + cardsHTML(mine.toAnswer, { actions: true })
            : '<div class="empty-hint">Hai risposto a tutto 🎉<br><a href="eventi.html?only=agenda">Vai alla tua agenda →</a></div>';
        } else if (only === 'annullati') {
          newHTML = mine.notGoing.length
            ? cardsHTML(mine.notGoing)
            : '<div class="empty-hint">Nessun evento annullato e nessun “non ci sono”.</div>';
        } else {
          newHTML = buildAgendaHTML(mine);
        }
        // 2026-10-26: prima volta al posto delle sagome, poi aggiornamenti
        // silenziosi (niente calendario/lista che rifà la dissolvenza).
        if (!SeevaData.swapHTML(listEl, newHTML)) return;
        lastListHTML = newHTML;
        if (window.SeevaUI) window.SeevaUI.refresh();
      }

      // Filtri e "Mostra altri" dell'agenda (delegati: la lista si ridisegna).
      listEl.addEventListener('click', function (e) {
        var chip = e.target.closest && e.target.closest('[data-agenda-filter]');
        if (chip) { agendaFilter = chip.getAttribute('data-agenda-filter'); render(); return; }
        if (e.target.closest && e.target.closest('#agendaMoreBtn')) { showAll = true; render(); return; }
      });

      // Risposta rapida dalla lista "Da rispondere": Ci sono / Forse / Non ci sono.
      var busyMap = null;
      listEl.addEventListener('click', async function (e) {
        var btn = e.target.closest && e.target.closest('[data-quick]');
        if (!btn || saving) return;
        var box = btn.closest('.my-card-actions');
        var card = btn.closest('.my-card');
        var eventId = box.getAttribute('data-event-id');
        var optionId = box.getAttribute('data-option-id');
        var dateISO = box.getAttribute('data-date-iso');
        var key = btn.getAttribute('data-quick');
        var ev = events.filter(function (x) { return x.id === eventId; })[0];
        if (!ev) return;

        // Date già impegnate (#15): stesso avviso della pagina evento.
        if (key === 'yes' && dateISO) {
          try {
            if (!busyMap) busyMap = await SeevaData.getMyBusyDates(null);
            var others = (busyMap[dateISO] || []).filter(function (b) { return b.eventId !== eventId; });
            var b = SeevaData.classifyBusy(others, SeevaData.formatTimeLabel(ev.eventTime));
            var unlockKey = 'seeva:busyUnlock:' + eventId + ':' + dateISO;
            var unlocked = false;
            try { unlocked = localStorage.getItem(unlockKey) === '1'; } catch (err) { /* ignora */ }
            if (b.hard.length && !unlocked) {
              var names = b.hard.map(SeevaData.busyLabel).join(', ');
              if (!await SeevaUI.ask('Quel giorno hai già ' + names + '.\n\nVuoi rispondere "Ci sono" lo stesso?')) return;
              try { localStorage.setItem(unlockKey, '1'); } catch (err) { /* ignora */ }
            }
          } catch (err) { /* in dubbio non blocchiamo la risposta */ }
        }

        saving = true;
        var buttons = box.querySelectorAll('button');
        buttons.forEach(function (x) { x.disabled = true; });
        var original = btn.textContent;
        btn.textContent = 'Salvo...';
        try {
          // L'evento aggiornato che torna indietro sostituisce subito quello
          // in lista: la card sparisce anche se il ricaricamento completo
          // qui sotto non dovesse riuscire.
          var updated = await SeevaData.upsertParticipant(eventId, SeevaData.getGuestName(), key === 'yes' ? [optionId] : [], [], undefined, key === 'maybe');
          if (updated && updated.id) events = events.map(function (x) { return x.id === updated.id ? updated : x; });
        } catch (err) {
          saving = false;
          buttons.forEach(function (x) { x.disabled = false; });
          btn.textContent = original;
          SeevaUI.alert('Non sono riuscito a salvare la tua risposta (' + SeevaData.friendlyErrorMessage(err) + '). Riprova.');
          return;
        }
        if (window.SeevaUI && window.SeevaUI.toast) {
          window.SeevaUI.toast(key === 'yes' ? 'Ci sono ✓ — lo trovi nella tua agenda' : key === 'maybe' ? 'Forse 🤔 — lo trovi nella tua agenda' : 'Non ci sono — lo trovi negli annullati');
        }
        if (card) card.classList.add('is-leaving');
        window.setTimeout(async function () {
          try { await loadEvents(); } catch (err) { /* resta la lista di prima */ }
          saving = false;
          render();
        }, 260);
      });

      // Avvio istantaneo (2026-10-05): ultima lista vista su questo telefono
      // subito, poi quella fresca.
      var instant = SeevaData.getEventsInstant ? SeevaData.getEventsInstant() : null;
      if (instant) {
        events = instant;
        render();
        loadEvents().then(render, function () { /* resta quella di prima */ });
      } else {
        try {
          await loadEvents();
          render();
        } catch (err) {
          listEl.innerHTML = '<div class="empty-hint">Non riesco a caricare i tuoi eventi. Controlla la connessione: riprovo da solo tra poco.</div>';
        }
      }

      // Fil, 2026-07-21: niente più refresh manuale — vedi
      // SeevaData.startAutoRefresh in data.js. Fil, 2026-07-22: stop
      // catturato su window.__seevaUnmount per il router SPA (script.js).
      window.__seevaUnmount = SeevaData.startAutoRefresh(async function () {
        if (saving) return;
        try { await loadEvents(); } catch (err) { return; } // silenzioso: la lista resta quella di prima
        render();
      });
    })();
  </script>
  <script src="script.js"></script>
</body>
</html>
