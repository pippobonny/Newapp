<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>seeva — Eventi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<!-- Pagine vicine precaricate in background (Fil, 2026-07-22): quando tocchi la barra in basso il browser le ha gia' scaricate, il salto si sente piu' veloce. Solo un suggerimento (il browser decide lui se/quando farlo, in base a rete e batteria) -- niente da rompere se lo ignora, es. Safari iOS lo supporta poco. -->
<link rel="prefetch" href="index.html">
<link rel="prefetch" href="crea.html">
<link rel="prefetch" href="amici.html">
<link rel="prefetch" href="profilo.html">
<meta name="theme-color" content="#FF7A29">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="seeva">
<script>
  /* Fix navbar tagliata sull'app installata (PWA a schermo intero): su alcuni
     Android/Chrome 100dvh non combacia col vero window.innerHeight quando
     l'app gira standalone, e la navbar finisce a metà, sotto la gesture bar.
     Misuriamo noi lo spazio vero e lo passiamo a style.css via --app-height.
     Solo in standalone: in Safari normale (scheda del browser) 100dvh da solo
     si aggiorna già correttamente quando la barra degli indirizzi si nasconde/
     mostra, mentre un innerHeight misurato una volta e aggiornato solo su
     resize/orientationchange restava indietro e lasciava una striscia grigia
     sotto la tab bar (bug notato da Fil su iPhone il 2026-07-05). */
  (function () {
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (!isStandalone) return;
    function setAppHeight() {
      document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
    }
    setAppHeight();
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', setAppHeight);
  })();
</script>
</head>
<body>

  <div class="phone">
   <div class="screen">
    <div class="header simple">
      <div class="header-title" id="eventiTitle">I tuoi eventi</div>
    </div>
    <!-- Fuori dall'header apposta (Fil, 2026-08-22): a.back-btn è
         position:absolute rispetto al primo antenato "position:relative"
         che trova — dentro l'header (alto solo quanto il titolo) finiva
         fuori schermo, qui invece l'antenato utile è .screen (alto quanto
         tutta la pagina), dove va davvero. -->
    <a class="back-btn" href="index.html" id="backBtn" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M15 18l-6-6 6-6"></path></svg></a>

    <div class="content">
      <div class="pill-row">
        <div class="pill active" data-filter="confermati">Confermati</div>
        <div class="pill" data-filter="attesa">In attesa</div>
        <div class="pill" data-filter="annullati">Annullati</div>
        <div class="pill" data-filter="tutti">Tutti</div>
      </div>

      <div id="eventsList"></div>
    </div>
   </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="data.js"></script>
  <script>
    (async function () {
      /* Stessa regola d'accesso di tutta l'app: senza account, si vede questa
         pagina solo se un lock ti confina qui (mai il caso per Eventi, che
         non è mai il "posto giusto" per un ospite bloccato) — altrimenti la
         schermata "serve un profilo" al posto della lista. */
      var gate = SeevaData.checkAccessGate(null);
      if (gate.action === 'redirect') {
        window.location.href = gate.url;
        return;
      }
      if (gate.action === 'block') {
        document.querySelector('.content').innerHTML = SeevaData.accountRequiredBlockHTML(
          'Per vedere i tuoi eventi devi prima creare un profilo.'
        );
        if (window.SeevaUI) window.SeevaUI.refresh();
        return;
      }

      await SeevaData.renderSessionWarningIfNeeded();

      var events = await SeevaData.getEvents();

      // Gli eventi "passato" (confermati e già successi da un po') restano
      // solo nell'archivio del Profilo: qui non compaiono in nessun filtro,
      // nemmeno "Tutti".
      events = events.filter(function (e) { return SeevaData.computeEventStatus(e).status !== 'passato'; });

      var listEl = document.getElementById('eventsList');
      var pills = document.querySelectorAll('.pill');
      var currentFilter = 'confermati';

      // Arrivo da un riquadro della Home (Fil, 2026-08-22): eventi.html?only=...
      // mostra SOLO quella categoria, senza modo di cambiarla da qui — se
      // potessi comunque scorrere le altre da dentro, i riquadri in Home
      // perderebbero senso (tanto valeva un'unica lista con i pill sempre
      // visibili, la vecchia versione). Per vedere un'altra categoria si
      // torna in Home e si tocca un altro riquadro.
      var ONLY_LABELS = { attesa: 'In attesa', confermati: 'Confermati', annullati: 'Annullati', tutti: 'Tutti gli eventi' };
      var onlyFilter = new URLSearchParams(window.location.search).get('only');
      if (onlyFilter && ONLY_LABELS[onlyFilter]) {
        currentFilter = onlyFilter;
        document.getElementById('backBtn').style.display = '';
        document.querySelector('.pill-row').style.display = 'none';
        document.getElementById('eventiTitle').textContent = ONLY_LABELS[onlyFilter];
      }
      // Fil, 2026-07-23, trovato in review: confrontare con listEl.innerHTML
      // (riletto dal browser) non funzionava mai davvero — il browser
      // normalizza leggermente l'HTML quando lo riconsegna, quindi il
      // confronto risultava "diverso" quasi sempre anche a parità di
      // contenuto. Tenendo l'ultimo HTML generato qui (mai riletto dal DOM)
      // il confronto è esatto.
      var lastListHTML = null;

      function matches(event, filter) {
        var status = SeevaData.computeEventStatus(event).status;
        if (filter === 'tutti') return true;
        // "tie" (pareggio, in attesa che l'organizzatore scelga una data)
        // conta come "in attesa" (Fil, 2026-08-22): prima restava visibile
        // solo sotto "Tutti", ora invece deve comparire anche qui — il
        // riquadro "Da confermare" in Home lo conta già tra le sue, il
        // numero deve corrispondere a quello che si vede aprendolo.
        if (filter === 'attesa') return status === 'waiting' || status === 'almost' || status === 'tie';
        if (filter === 'confermati') return status === 'done';
        if (filter === 'annullati') return status === 'cancelled';
        return true;
      }

      function render(filter) {
        var filtered = events.filter(function (e) { return matches(e, filter); });
        var newHTML = filtered.length
          ? filtered.map(SeevaData.renderEventCardHTML).join('')
          : '<div class="empty-hint">Nessun evento in questa categoria.</div>';

        // Fil, 2026-07-22: se il refresh automatico non ha trovato niente di
        // nuovo (il caso più comune), non tocca il DOM — altrimenti ogni
        // card, anche quelle identiche a prima, rifarebbe da capo la sua
        // animazione di comparsa ogni 30s.
        if (newHTML === lastListHTML) return;
        lastListHTML = newHTML;
        listEl.innerHTML = newHTML;
        // rianima/rende cliccabile il contenuto appena creato
        if (window.SeevaUI) window.SeevaUI.refresh();
      }

      pills.forEach(function (pill) {
        pill.addEventListener('click', function () {
          pills.forEach(function (p) { p.classList.remove('active'); });
          pill.classList.add('active');
          currentFilter = pill.getAttribute('data-filter');
          render(currentFilter);
        });
      });

      render(currentFilter);

      // Fil, 2026-07-21: niente più refresh manuale della pagina per vedere
      // un evento nuovo o una risposta arrivata mentre questa scheda era già
      // aperta — vedi SeevaData.startAutoRefresh in data.js.
      // Fil, 2026-07-22: catturato lo stop su window.__seevaUnmount, letto
      // dal router SPA in script.js prima di cambiare tab — vedi lo stesso
      // commento in index.html.
      window.__seevaUnmount = SeevaData.startAutoRefresh(async function () {
        var fresh;
        try {
          fresh = await SeevaData.getEvents();
        } catch (err) { return; } // silenzioso: la lista resta quella di prima
        events = fresh.filter(function (e) { return SeevaData.computeEventStatus(e).status !== 'passato'; });
        render(currentFilter);
      });
    })();
  </script>
  <script src="script.js"></script>
</body>
</html>
