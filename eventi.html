<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<script src="i18n.js"></script>
<script src="i18n-en.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>seeva — Eventi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://kruphqdahghxuvutonae.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<!-- Pagine vicine precaricate in background (Fil, 2026-07-22): quando tocchi la barra in basso il browser le ha gia' scaricate, il salto si sente piu' veloce. Solo un suggerimento (il browser decide lui se/quando farlo, in base a rete e batteria) -- niente da rompere se lo ignora, es. Safari iOS lo supporta poco. -->
<link rel="prefetch" href="index.html">
<link rel="prefetch" href="crea.html">
<link rel="prefetch" href="amici.html">
<link rel="prefetch" href="profilo.html">
<meta name="theme-color" content="#FF7A29">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="seeva">
<script>
  /* Fix navbar tagliata sull'app installata (PWA a schermo intero): su alcuni
     Android/Chrome 100dvh non combacia col vero window.innerHeight quando
     l'app gira standalone, e la navbar finisce a metà, sotto la gesture bar.
     Misuriamo noi lo spazio vero e lo passiamo a style.css via --app-height.
     Solo in standalone: in Safari normale (scheda del browser) 100dvh da solo
     si aggiorna già correttamente quando la barra degli indirizzi si nasconde/
     mostra, mentre un innerHeight misurato una volta e aggiornato solo su
     resize/orientationchange restava indietro e lasciava una striscia grigia
     sotto la tab bar (bug notato da Fil su iPhone il 2026-07-05). */
  (function () {
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (!isStandalone) return;
    function setAppHeight() {
      document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
    }
    setAppHeight();
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', setAppHeight);
  })();
</script>
</head>
<body>

  <div class="phone">
   <div class="screen">
    <div class="header simple">
      <div class="header-title" id="eventiTitle">I tuoi eventi</div>
    </div>
    <!-- Fuori dall'header apposta (Fil, 2026-08-22): a.back-btn è
         position:absolute rispetto al primo antenato "position:relative"
         che trova — dentro l'header (alto solo quanto il titolo) finiva
         fuori schermo, qui invece l'antenato utile è .screen (alto quanto
         tutta la pagina), dove va davvero. -->
    <a class="back-btn" href="index.html" id="backBtn" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M15 18l-6-6 6-6"></path></svg></a>

    <div class="content">
      <div class="pill-row">
        <div class="pill active" data-filter="confermati">Confermati</div>
        <div class="pill" data-filter="attesa">In attesa</div>
        <div class="pill" data-filter="annullati">Annullati</div>
        <div class="pill" data-filter="tutti">Tutti</div>
      </div>

      <div id="eventsList"></div>
    </div>
   </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script src="data.js"></script>
  <script>
    (async function () {
      /* Stessa regola d'accesso di tutta l'app: senza account, si vede questa
         pagina solo se un lock ti confina qui (mai il caso per Eventi, che
         non è mai il "posto giusto" per un ospite bloccato) — altrimenti la
         schermata "serve un profilo" al posto della lista. */
      var gate = SeevaData.checkAccessGate(null);
      if (gate.action === 'redirect') {
        window.location.href = gate.url;
        return;
      }
      if (gate.action === 'block') {
        document.querySelector('.content').innerHTML = SeevaData.accountRequiredBlockHTML(
          'Per vedere i tuoi eventi devi prima creare un profilo.'
        );
        if (window.SeevaUI) window.SeevaUI.refresh();
        return;
      }

      await SeevaData.renderSessionWarningIfNeeded();

      /* ---------- Nuova Home (Fil, 2026-10-04) ----------
         Questa pagina ora mostra una delle tre liste "tue" aperte dai
         riquadri della Home: Da rispondere / La tua agenda / Annullati (che
         comprende anche quelli a cui non vai). Smistamento: una sola
         funzione, SeevaData.classifyMyEvents, la stessa dei numeri in Home.
         I vecchi link (?only=attesa, confermati, tutti — notifiche ed email
         già spedite) portano alla lista nuova più vicina. */
      var OLD_TO_NEW = { attesa: 'rispondere', confermati: 'agenda', tutti: 'agenda' };
      var TITLES = { rispondere: 'Da rispondere', agenda: 'La tua agenda', annullati: 'Annullati e non ci vai' };
      var only = new URLSearchParams(window.location.search).get('only') || 'agenda';
      only = OLD_TO_NEW[only] || only;
      if (!TITLES[only]) only = 'agenda';

      document.getElementById('backBtn').style.display = '';
      var pillRow = document.querySelector('.pill-row');
      if (pillRow) pillRow.style.display = 'none';
      document.getElementById('eventiTitle').textContent = TITLES[only];

      var listEl = document.getElementById('eventsList');
      var events = [];
      var agendaFilter = 'tutti';   // tutti | yes | maybe | decidere
      var showAll = false;          // agenda: oltre la fine dell'anno
      var saving = false;
      var lastListHTML = null;

      // Gli annullati (a mano) si scaricano solo aprendo la loro lista
      // (2026-10-05), e si uniscono a quelli attivi senza doppioni.
      async function loadEvents() {
        var list = await SeevaData.getEvents();
        if (only === 'annullati' && SeevaData.getCancelledEvents) {
          var ids = list.map(function (e) { return e.id; });
          var cancelled = await SeevaData.getCancelledEvents();
          list = list.concat(cancelled.filter(function (e) { return ids.indexOf(e.id) === -1; }));
        }
        events = list;
      }

      function monthTitle(iso) {
        var d = new Date(iso + 'T00:00:00');
        var m = d.toLocaleDateString(window.SeevaI18n ? SeevaI18n.locale() : 'it-IT', { month: 'long' });
        m = m.charAt(0).toUpperCase() + m.slice(1);
        return d.getFullYear() === new Date().getFullYear() ? m : m + ' ' + d.getFullYear();
      }

      function cardsHTML(items, opts) {
        return items.map(function (it) { return SeevaData.renderMyEventCardHTML(it, opts); }).join('');
      }

      function buildAgendaHTML(mine) {
        var decided = mine.agenda;
        var nYes = decided.filter(function (i) { return i.myKey === 'yes' || i.myKey === 'organizer'; }).length;
        var nMaybe = decided.filter(function (i) { return i.myKey === 'maybe'; }).length;
        var nDec = mine.undecided.length;
        var chips = [
          ['tutti', 'Tutti', decided.length + nDec],
          ['yes', 'Ci sei', nYes],
          ['maybe', 'Forse', nMaybe],
          ['decidere', 'Da decidere', nDec]
        ];
        var html = '<div class="agenda-chips">' + chips.map(function (c) {
          return '<button type="button" class="agenda-chip' + (agendaFilter === c[0] ? ' active' : '') + '" data-agenda-filter="' + c[0] + '">' + c[1] + ' <span>' + c[2] + '</span></button>';
        }).join('') + '</div>';

        if (agendaFilter === 'tutti' || agendaFilter === 'decidere') {
          if (mine.undecided.length) {
            html += '<div class="agenda-group-title">Data da decidere</div>' + cardsHTML(mine.undecided);
          }
        }
        if (agendaFilter !== 'decidere') {
          var list = decided.filter(function (i) {
            if (agendaFilter === 'yes') return i.myKey === 'yes' || i.myKey === 'organizer';
            if (agendaFilter === 'maybe') return i.myKey === 'maybe';
            return true;
          });
          // Pagina mai infinita: fino a fine anno (almeno 8 eventi), il resto
          // dietro "Mostra altri".
          var endOfYear = new Date().getFullYear() + '-12-31';
          var visible = showAll ? list : list.filter(function (i, idx) { return i.dateISO <= endOfYear || idx < 8; });
          var lastMonth = null;
          visible.forEach(function (i) {
            var mt = monthTitle(i.dateISO);
            if (mt !== lastMonth) { html += '<div class="agenda-group-title">' + SeevaData.escapeHTML(mt) + '</div>'; lastMonth = mt; }
            html += SeevaData.renderMyEventCardHTML(i);
          });
          var hidden = list.length - visible.length;
          if (hidden > 0) {
            html += '<button type="button" class="agenda-more" id="agendaMoreBtn">' + (hidden === 1 ? t('Mostra altri · 1 evento') : t('Mostra altri · {n} eventi', { n: hidden })) + '</button>';
          }
          if (!list.length && !(agendaFilter === 'tutti' && mine.undecided.length)) {
            html += '<div class="empty-hint">Niente qui per ora.</div>';
          }
        } else if (!mine.undecided.length) {
          html += '<div class="empty-hint">Nessun evento con la data da decidere.</div>';
        }
        html += '<div class="agenda-foot">Gli eventi passati restano nel tuo Profilo.</div>';
        return html;
      }

      function render() {
        var mine = SeevaData.classifyMyEvents(events);
        var newHTML;
        if (only === 'rispondere') {
          newHTML = mine.toAnswer.length
            ? '<div class="list-hint">I più urgenti prima.</div>' + cardsHTML(mine.toAnswer, { actions: true })
            : '<div class="empty-hint">Hai risposto a tutto 🎉<br><a href="eventi.html?only=agenda">Vai alla tua agenda →</a></div>';
        } else if (only === 'annullati') {
          newHTML = mine.notGoing.length
            ? cardsHTML(mine.notGoing)
            : '<div class="empty-hint">Nessun evento annullato e nessun “non ci sono”.</div>';
        } else {
          newHTML = buildAgendaHTML(mine);
        }
        if (newHTML === lastListHTML) return;
        lastListHTML = newHTML;
        listEl.innerHTML = newHTML;
        if (window.SeevaUI) window.SeevaUI.refresh();
      }

      // Filtri e "Mostra altri" dell'agenda (delegati: la lista si ridisegna).
      listEl.addEventListener('click', function (e) {
        var chip = e.target.closest && e.target.closest('[data-agenda-filter]');
        if (chip) { agendaFilter = chip.getAttribute('data-agenda-filter'); render(); return; }
        if (e.target.closest && e.target.closest('#agendaMoreBtn')) { showAll = true; render(); return; }
      });

      // Risposta rapida dalla lista "Da rispondere": Ci sono / Forse / Non ci sono.
      var busyMap = null;
      listEl.addEventListener('click', async function (e) {
        var btn = e.target.closest && e.target.closest('[data-quick]');
        if (!btn || saving) return;
        var box = btn.closest('.my-card-actions');
        var card = btn.closest('.my-card');
        var eventId = box.getAttribute('data-event-id');
        var optionId = box.getAttribute('data-option-id');
        var dateISO = box.getAttribute('data-date-iso');
        var key = btn.getAttribute('data-quick');
        var ev = events.filter(function (x) { return x.id === eventId; })[0];
        if (!ev) return;

        // Date già impegnate (#15): stesso avviso della pagina evento.
        if (key === 'yes' && dateISO) {
          try {
            if (!busyMap) busyMap = await SeevaData.getMyBusyDates(null);
            var others = (busyMap[dateISO] || []).filter(function (b) { return b.eventId !== eventId; });
            var b = SeevaData.classifyBusy(others, SeevaData.formatTimeLabel(ev.eventTime));
            var unlockKey = 'seeva:busyUnlock:' + eventId + ':' + dateISO;
            var unlocked = false;
            try { unlocked = localStorage.getItem(unlockKey) === '1'; } catch (err) { /* ignora */ }
            if (b.hard.length && !unlocked) {
              var names = b.hard.map(SeevaData.busyLabel).join(', ');
              if (!window.confirm('Quel giorno hai già ' + names + '.\n\nVuoi rispondere "Ci sono" lo stesso?')) return;
              try { localStorage.setItem(unlockKey, '1'); } catch (err) { /* ignora */ }
            }
          } catch (err) { /* in dubbio non blocchiamo la risposta */ }
        }

        saving = true;
        var buttons = box.querySelectorAll('button');
        buttons.forEach(function (x) { x.disabled = true; });
        var original = btn.textContent;
        btn.textContent = 'Salvo...';
        try {
          // L'evento aggiornato che torna indietro sostituisce subito quello
          // in lista: la card sparisce anche se il ricaricamento completo
          // qui sotto non dovesse riuscire.
          var updated = await SeevaData.upsertParticipant(eventId, SeevaData.getGuestName(), key === 'yes' ? [optionId] : [], [], undefined, key === 'maybe');
          if (updated && updated.id) events = events.map(function (x) { return x.id === updated.id ? updated : x; });
        } catch (err) {
          saving = false;
          buttons.forEach(function (x) { x.disabled = false; });
          btn.textContent = original;
          window.alert('Non sono riuscito a salvare la tua risposta (' + SeevaData.friendlyErrorMessage(err) + '). Riprova.');
          return;
        }
        if (window.SeevaUI && window.SeevaUI.toast) {
          window.SeevaUI.toast(key === 'yes' ? 'Ci sei ✓ — lo trovi nella tua agenda' : key === 'maybe' ? 'Forse 🤔 — lo trovi nella tua agenda' : 'Non ci sei — lo trovi negli annullati');
        }
        if (card) card.classList.add('is-leaving');
        window.setTimeout(async function () {
          try { await loadEvents(); } catch (err) { /* resta la lista di prima */ }
          saving = false;
          render();
        }, 260);
      });

      // Avvio istantaneo (2026-10-05): ultima lista vista su questo telefono
      // subito, poi quella fresca.
      var instant = SeevaData.getEventsInstant ? SeevaData.getEventsInstant() : null;
      if (instant) {
        events = instant;
        render();
        loadEvents().then(render, function () { /* resta quella di prima */ });
      } else {
        await loadEvents();
        render();
      }

      // Fil, 2026-07-21: niente più refresh manuale — vedi
      // SeevaData.startAutoRefresh in data.js. Fil, 2026-07-22: stop
      // catturato su window.__seevaUnmount per il router SPA (script.js).
      window.__seevaUnmount = SeevaData.startAutoRefresh(async function () {
        if (saving) return;
        try { await loadEvents(); } catch (err) { return; } // silenzioso: la lista resta quella di prima
        render();
      });
    })();
  </script>
  <script src="script.js"></script>
</body>
</html>
