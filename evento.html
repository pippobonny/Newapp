<!DOCTYPE html>
<html lang="it" translate="no">
<head>
<meta charset="UTF-8">
<!-- Niente traduzione automatica di Chrome (Fil, 2026-10-10): l'app ha già italiano/inglese suoi; con l'app in inglese su un telefono italiano Chrome traduceva sopra, mischiando le lingue. -->
<meta name="google" content="notranslate">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://kruphqdahghxuvutonae.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF7A29">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="seeva">
<script>
  /* Fix navbar tagliata sull'app installata (PWA a schermo intero): su alcuni
     Android/Chrome 100dvh non combacia col vero window.innerHeight quando
     l'app gira standalone, e la navbar finisce a metà, sotto la gesture bar.
     Misuriamo noi lo spazio vero e lo passiamo a style.css via --app-height.
     Solo in standalone: in Safari normale (scheda del browser) 100dvh da solo
     si aggiorna già correttamente quando la barra degli indirizzi si nasconde/
     mostra, mentre un innerHeight misurato una volta e aggiornato solo su
     resize/orientationchange restava indietro e lasciava una striscia grigia
     sotto la tab bar (bug notato da Fil su iPhone il 2026-07-05). */
  (function () {
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (!isStandalone) return;
    function setAppHeight() {
      document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
    }
    setAppHeight();
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', setAppHeight);
  })();
</script>
</head>
<body>

  <div class="phone">
   <div class="screen">
    <div class="header simple">
      <div class="header-title is-hidden" id="eventTitle">Evento</div>
      <div class="header-menu-wrap" id="eventMenuWrap" style="display:none;">
        <div class="back-btn" id="eventMenuBtn" style="cursor:pointer;">⋮</div>
        <span class="menu-dot" id="menuDot" style="display:none;"></span>
        <div class="menu-dropdown" id="eventMenuDropdown">
          <a class="menu-dropdown-item" id="menuEditLink" href="#" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg> Modifica</a>
          <!-- "Aggiungi persone" (Fil, 2026-09-26): solo nuovi invitati, in un
               popup, senza rifare tutto il giro di Modifica. -->
          <div class="menu-dropdown-item" id="menuAddPeopleBtn" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><circle cx="9" cy="8.5" r="3"></circle><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"></path><line x1="18" y1="8" x2="18" y2="14"></line><line x1="15" y1="11" x2="21" y2="11"></line></svg> Aggiungi persone</div>
          <div class="menu-dropdown-item" id="menuEditAvailabilityBtn" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><rect x="3" y="5" width="18" height="16" rx="3"></rect><line x1="16" y1="3" x2="16" y2="7"></line><line x1="8" y1="3" x2="8" y2="7"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> I giorni in cui ci sei</div>
          <!-- Sollecito a chi non ha ancora risposto (Fil, 2026-09-26): solo
               per chi organizza, solo su evento ancora aperto e con almeno
               un invitato in attesa. Visibilità aggiornata in render(), il
               limite dei 15 minuti lo fa il server (notify-event-nudge). -->
          <div class="menu-dropdown-item" id="menuNudgeBtn" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg> Sollecita chi non ha risposto</div>
          <!-- Avviso a tutti gli invitati (Fil, 2026-10-07): messaggio che
               arriva come notifica e resta fisso in cima alla pagina evento.
               Solo chi organizza, evento non annullato. -->
          <div class="menu-dropdown-item" id="menuAnnounceBtn" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg> Manda un avviso a tutti</div>
          <!-- Spenta di default su ogni evento nuovo, visibile solo a chi
               organizza (Fil, 2026-07-21: "rimane nascosta appena crei
               l'evento e poi da lì se vuoi la metti"). Etichetta e stato
               aggiornati ad ogni render() in updateItemsToggleMenuLabel(). -->
          <div class="menu-dropdown-item" id="menuToggleItemsBtn" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M8 8V6a4 4 0 0 1 8 0v2"></path><rect x="4" y="8" width="16" height="13" rx="3"></rect><rect x="9" y="8" width="6" height="4" rx="1"></rect></svg> Chi porta cosa</div>
          <!-- Stesso pattern del toggle "chi porta cosa" qui sopra, ma per la
               divisione spese (Fil, 2026-07-25): scelta di default alla
               creazione, cambiabile qui dopo. -->
          <div class="menu-dropdown-item" id="menuToggleExpensesBtn" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v10"></path><path d="M9 9.5c0-1.4 1.3-2.5 3-2.5s3 1.1 3 2.5-1.3 2.2-3 2.5c-1.7 0.3-3 1.1-3 2.5s1.3 2.5 3 2.5 3-1.1 3-2.5"></path></svg> Dividi le spese</div>
          <div class="menu-dropdown-item danger" id="menuDeleteBtn" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M4 7h16"></path><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"></path><line x1="9" y1="11" x2="9" y2="17"></line><line x1="15" y1="11" x2="15" y2="17"></line></svg> Elimina</div>
          <!-- Solo per chi NON organizza (Fil, 2026-07-20): rimuove l'evento
               dalla propria home perché tanto non ci sarà. Non tocca i
               conteggi che vede l'organizzatore, azione definitiva (vedi
               removeEventFromHome in data.js). -->
          <div class="menu-dropdown-item danger" id="menuRemoveFromHomeBtn" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M4 7h16"></path><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"></path><line x1="9" y1="11" x2="9" y2="17"></line><line x1="15" y1="11" x2="15" y2="17"></line></svg> Rimuovi dalla home</div>
        </div>
      </div>
    </div>
    <!-- Fuori dall'header apposta (Fil, 2026-08-22): vedi lo stesso
         commento in eventi.html — a.back-btn è position:absolute rispetto
         a .screen, non all'header (troppo basso). Il bottone menu ⋮ sopra
         resta invece dentro l'header: è un div, non un back-btn vero, la
         regola position:absolute riguarda solo gli <a>. -->
    <a class="back-btn" href="index.html" id="backBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M15 18l-6-6 6-6"></path></svg></a>

    <!-- Bug/idea segnalata dall'app (Fil, 2026-08-25): niente più
         riquadro con dentro il link scritto per esteso — solo
         l'organizzatore, solo finché ha senso invitare, una bolla a
         specchio di quella viola (stessa forma/posizione, lato opposto)
         con solo l'icona condividi: "la gente ormai la riconosce". Tap
         apre il foglio di condivisione di sistema se disponibile
         (navigator.share, WhatsApp ecc.), altrimenti copia il link —
         stessa logica di sempre, vedi setupShareFab() più sotto. Statica come
         a.back-btn (mai dentro contentEl.innerHTML, altrimenti si
         perderebbe/riapparirebbe ad ogni render), nascosta di default e
         mostrata da render() solo quando serve. -->
    <div class="share-fab" id="shareFab" style="display:none;" title="Condividi questo link con gli amici"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><line x1="8.3" y1="10.7" x2="15.7" y2="6.3"></line><line x1="8.3" y1="13.3" x2="15.7" y2="17.7"></line></svg></div>

    <div class="content" id="eventContent">
      <div class="empty-hint">Caricamento...</div>
    </div>
   </div>

  </div>

  <!-- Bug segnalato dall'app (Fil, 2026-08-25): il popup "Chi viene" veniva
       generato dentro #eventContent (.content), che ha il suo
       position:relative — lo sfondo sfocato restava chiuso dentro quel
       riquadro invece di coprire tutto lo schermo, lasciando l'header col
       titolo evento sopra, nitido e non sfocato. Fuori da .phone come
       expenseModal qui sotto (stesso trattamento, stesso motivo), il suo
       contenuto viene scritto qui dentro da render() invece che dentro
       contentEl.innerHTML — vedi whoComingModalHTML in render(). -->
  <div id="whoComingModalWrap"></div>

  <!-- Stesso motivo di whoComingModalWrap qui sopra: il popup commenti
       deve sfocare tutto lo schermo, non solo .content. -->
  <div id="commentsModalWrap"></div>

  <!-- Pannelli dal basso Spese / Chi porta cosa (Fil, 2026-11-01): fuori da
       .phone come i popup, contenuto scritto da refreshExpensesSheet /
       refreshItemsSheet. -->
  <div class="sv-sheet-overlay" id="expensesSheet" style="display:none;">
    <div class="sv-sheet" role="dialog" aria-label="Spese">
      <div class="sv-sheet-grab">
        <div class="sv-sheet-handle"></div>
        <div class="sv-sheet-head">
          <div class="sv-sheet-title">💶 Spese</div>
          <button type="button" class="sv-sheet-close" data-sheet-close aria-label="Chiudi">✕</button>
        </div>
      </div>
      <div class="sv-sheet-body" id="expensesSheetBody"></div>
    </div>
  </div>
  <div class="sv-sheet-overlay" id="itemsSheet" style="display:none;">
    <div class="sv-sheet" role="dialog" aria-label="Chi porta cosa">
      <div class="sv-sheet-grab">
        <div class="sv-sheet-handle"></div>
        <div class="sv-sheet-head">
          <div class="sv-sheet-title">🎒 Chi porta cosa</div>
          <button type="button" class="sv-sheet-close" data-sheet-close aria-label="Chiudi">✕</button>
        </div>
      </div>
      <div class="sv-sheet-body" id="itemsSheetBody"></div>
    </div>
  </div>

  <!-- Nuova/modifica spesa, semplificata (Fil, 2026-11-01): importo grande
       con la tastiera dei numeri subito, "per cosa", e basta. Pagato da te e
       diviso tra tutti di base; "Cambia" apre chi ha pagato / tra chi.
       L'emoji si sceglie da sola dalla parola. -->
  <div class="signup-overlay exp-modal-overlay" id="expenseModal" style="display:none;">
    <div class="signup-modal exp-modal">
      <div class="list-header" style="margin-bottom:10px;">
        <div class="card-title" id="expenseModalTitle">Nuova spesa</div>
        <div class="list-delete" id="expenseModalCloseBtn">Chiudi ✕</div>
      </div>

      <div class="exp-amount-wrap">
        <input type="text" id="expenseAmountInput" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Quanto">
        <span class="exp-amount-cur">€</span>
      </div>
      <div class="exp-desc-wrap">
        <span class="exp-desc-emoji" id="expenseEmojiPreview">💶</span>
        <input type="text" id="expenseDescInput" maxlength="80" placeholder="Per cosa? Es. spesa, benzina, pizza..." enterkeyhint="done">
      </div>

      <div class="exp-who-row">
        <span class="exp-who" id="expenseWhoLine"></span>
        <button type="button" class="exp-who-toggle" id="expenseDetailsToggle">Cambia</button>
      </div>

      <div id="expenseDetails" style="display:none;">
        <div class="field">
          <label>Chi ha pagato</label>
          <select id="expensePaidBySelect"></select>
        </div>
        <label class="exp-split-all">
          <span><b>Tra tutti</b> <span class="exp-split-hint" id="expenseSplitAllHint"></span></span>
          <input type="checkbox" id="expenseSplitAllCheckbox" class="option-row-switch" checked>
        </label>
        <div class="field" id="expenseIncludeField" style="display:none;">
          <label>Tra chi si divide</label>
          <div class="option-group" id="expenseIncludeList"></div>
        </div>
      </div>

      <div class="form-error" id="expenseModalError"></div>
      <button type="button" class="primary-btn" id="expenseSaveBtn">Salva spesa</button>
      <button type="button" class="exp-delete-btn" id="expenseDeleteBtn" style="display:none;">Elimina questa spesa</button>
    </div>
  </div>

  <!-- Quanto hai speso per una voce di "chi porta cosa" (Fil, 2026-11-01). -->
  <div class="signup-overlay exp-modal-overlay" id="itemCostModal" style="display:none;">
    <div class="signup-modal exp-modal">
      <div class="list-header" style="margin-bottom:6px;">
        <div class="card-title">Quanto l'hai pagata?</div>
        <div class="list-delete" id="itemCostCloseBtn">Chiudi ✕</div>
      </div>
      <div class="exp-who" id="itemCostWhat" data-no-i18n></div>
      <div class="exp-amount-wrap">
        <input type="text" id="itemCostInput" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Quanto">
        <span class="exp-amount-cur">€</span>
      </div>
      <div class="form-error" id="itemCostError"></div>
      <button type="button" class="primary-btn" id="itemCostSaveBtn">Salva</button>
      <button type="button" class="exp-delete-btn" id="itemCostRemoveBtn" style="display:none;">Togli la spesa</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script src="data.js"></script>
  <script src="evento.js"></script>
  <script src="script.js"></script>

</body>
</html>
