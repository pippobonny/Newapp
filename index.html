<script>
  /* Fix navbar tagliata sull'app installata (PWA a schermo intero): su alcuni
     Android/Chrome 100dvh non combacia col vero window.innerHeight quando
     l'app gira standalone, e la navbar finisce a metà, sotto la gesture bar.
     Misuriamo noi lo spazio vero e lo passiamo a style.css via --app-height.
     Solo in standalone: in Safari normale (scheda del browser) 100dvh da solo
     si aggiorna già correttamente quando la barra degli indirizzi si nasconde/
     mostra, mentre un innerHeight misurato una volta e aggiornato solo su
     resize/orientationchange restava indietro e lasciava una striscia grigia
     sotto la tab bar (bug notato da Fil su iPhone il 2026-07-05). */
  (function () {
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (!isStandalone) return;
    function setAppHeight() {
      document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
    }
    setAppHeight();
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', setAppHeight);
  })();
</script>

<body>

  <!-- Splash "veramente breve" solo in Home, solo se sono passate alcune ore
       dall'ultima volta (non a ogni apertura/navigazione): questo script
       inline, sincrono, decide SUBITO se nasconderla, prima che il resto
       della pagina venga dipinto, per non avere nessun flash. La vera
       animazione di uscita (fade + timestamp aggiornato) la fa
       initSplashScreen() in script.js, solo quando resta visibile qui. -->
  <div class="splash-screen" id="splashScreen"><img class="splash-logo" src="splash-logo.png" alt="seeva"></div>
  <script>
    (function () {
      try {
        var SPLASH_MIN_GAP_MS = 3 * 60 * 60 * 1000; // 3 ore: quanto deve passare prima di rivederla
        var last = parseInt(localStorage.getItem('seeva:splashLastShown'), 10);
        if (last && (Date.now() - last) < SPLASH_MIN_GAP_MS) {
          document.getElementById('splashScreen').style.display = 'none';
        }
      } catch (e) {}
    })();
  </script>

  <div class="phone">
   <div class="screen">
    <div class="header simple home-header">
      <div class="profile">
        <a class="avatar" id="homeAvatar" href="profilo.html">?</a>
        <div class="greeting">
          <div class="name" id="homeGreeting">Ciao, Ospite</div>
          <div class="date" id="todayDate">Oggi</div>
        </div>
      </div>
      <a class="bell" href="notifiche.html" id="homeBell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="19" height="19">
          <path d="M12 3a6 6 0 0 0-6 6v3.2c0 .87-.35 1.7-.97 2.32L4 15.5h16l-1.03-1.98A3.28 3.28 0 0 1 18 11.2V9a6 6 0 0 0-6-6z"></path>
          <path d="M9.5 18.5a2.5 2.5 0 0 0 5 0"></path>
        </svg>
        <span class="bell-badge" id="bellBadge" style="display:none;"></span>
      </a>
    </div>

    <div class="top-badge-wrap">
      <div class="attendance-badge" id="attendanceBadge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M12 21c4 0 7-2.7 7-6.8 0-3-1.8-4.9-3.1-7-1 1.6-1.9 1.9-2.5 1.4.6-2.7-.6-5.4-3.1-7-.3 2.6-1.6 4.4-3.4 6.1C5.3 9.2 5 11.2 5 12.9 5 17.6 8 21 12 21z"></path><path d="M12 21c1.8 0 3-1.3 3-3.1 0-1.5-1-2.6-1.9-3.5-.5.8-.9.9-1.2.7.2-1.2-.3-2.4-1.4-3.1-.1 1.1-.8 1.9-1.5 2.6-.7.7-1 1.7-1 2.5 0 2.2 1.4 3.9 4 3.9z"></path></svg> Presente a tutti gli ultimi eventi</div>
    </div>

    <div class="content">
      <!-- Home nuova (Fil + Virgi, 2026-10-25): niente più riquadri
           colorati da aprire, gli eventi stanno direttamente qui (vedi
           renderFeed sotto). Crea e Amici sono nella barra in basso. -->
      <div id="homeFeed"></div>

   </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script src="data.js"></script>
  <script>
    (async function () {
      /* Entrare qui "dal nulla" (indirizzo diretto, non da un link di invito)
         richiede un account: niente più "continua senza registrazione" fuori
         dal flusso di invito (vedi amico.html). Un ospite bloccato su un
         evento o su una lista viene rimandato lì; chi non ha proprio nessun
         account e nessun invito attivo va sulla pagina di presentazione
         invece della vecchia schermata "serve un profilo" (Fil, 2026-08-25,
         bug segnalato dall'app: "aggiungere una pagina di benvenuto la
         prima volta che uno entra sul sito, spiegando cosa è l'app") — chi
         invece è già loggato continua giù, dritto sulla vera Home. */
      var gate = SeevaData.checkAccessGate(null);
      if (gate.action === 'redirect') {
        window.location.href = gate.url;
        return;
      }
      if (gate.action === 'block') {
        window.location.replace('presentazione.html');
        return;
      }

      await SeevaData.renderSessionWarningIfNeeded();

      var guestName = SeevaData.getGuestName();
      document.getElementById('homeGreeting').textContent = 'Ciao, ' + (guestName || 'Ospite');

      var homeAvatarEl = document.getElementById('homeAvatar');
      var homeAcc = SeevaData.getAccount();
      if (homeAcc && homeAcc.avatarUrl) {
        homeAvatarEl.innerHTML = '';
        var homeAvatarImg = document.createElement('img');
        homeAvatarImg.src = homeAcc.avatarUrl;
        homeAvatarImg.style.width = '100%';
        homeAvatarImg.style.height = '100%';
        homeAvatarImg.style.objectFit = 'cover';
        homeAvatarImg.style.borderRadius = '50%';
        homeAvatarEl.appendChild(homeAvatarImg);
      } else {
        if (guestName) {
          homeAvatarEl.textContent = guestName.trim().charAt(0).toUpperCase();
        } else {
          homeAvatarEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>';
        }
      }

      // swipeToRemove: true solo qui in Home (Fil, 2026-07-20) — vedi il
      var bellBadge = document.getElementById('bellBadge');
      var homeBellEl = document.getElementById('homeBell');
      var lastNotifKey = null;
      var notifBellInitialized = false;

      /* ---------- Home nuova (Fil + Virgi, 2026-10-25) ----------
         1) "Da rispondere": le card con i pulsanti Ci sono/Forse/Non ci
            sono (le stesse della lista in eventi.html, stessa risposta
            rapida qui sotto) — le prime 4, poi "Vedi tutti".
         2) "In programma": data da decidere + agenda, i prossimi 5.
         3) In fondo, piccolo, il link agli annullati (se ce ne sono).
         Niente in programma e niente da rispondere -> invito a creare. */
      var homeFeed = document.getElementById('homeFeed');
      var homeEvents = [];
      var lastFeedHTML = null;
      var homeSaving = false;
      var TO_ANSWER_MAX = 4;
      var AGENDA_MAX = 5;

      function sectionHead(title, count, moreHref, moreLabel) {
        return '<div class="hm-section-head"><div class="hm-section-title">' + SeevaData.escapeHTML(title)
          + (count ? ' <span class="hm-count">' + count + '</span>' : '') + '</div>'
          + (moreHref ? '<a class="hm-more" href="' + moreHref + '">' + SeevaData.escapeHTML(moreLabel) + '</a>' : '') + '</div>';
      }

      function renderFeed(mine, cancelledCount) {
        /* Home "solo cose da fare" (Fil, 2026-10-25, scelta tra 3 bozze):
           - in cima "Hai N cose da fare": schede grandi e pulite, una alla
             volta, da scorrere di lato (pallini sotto);
           - poi "In programma questa settimana" a righe di una sola linea
             (se questa settimana non c'è niente: "Il prossimo");
           - in fondo "Apri l'agenda". Niente più "Hai risposto a tutti". */
        var esc = SeevaData.escapeHTML;
        var html = '';
        var todo = mine.toAnswer;
        if (todo.length) {
          html += '<div class="hm-todo-title">' + esc(todo.length === 1 ? t('Hai 1 cosa da fare') : t('Hai {n} cose da fare', { n: todo.length })) + '</div>'
            + '<div class="hm-swipe" id="hmSwipe">' + todo.map(actionCardHTML).join('') + '</div>'
            + (todo.length > 1 ? '<div class="hm-dots" id="hmDots">' + todo.map(function (x, i) { return '<i' + (i === 0 ? ' class="on"' : '') + '></i>'; }).join('') + '</div>' : '');
        }

        var upcoming = mine.agenda.slice().sort(function (a, b) { return a.dateISO < b.dateISO ? -1 : 1; });
        var weekEnd = new Date(); weekEnd.setDate(weekEnd.getDate() + 7);
        var weekEndISO = weekEnd.getFullYear() + '-' + ('0' + (weekEnd.getMonth() + 1)).slice(-2) + '-' + ('0' + weekEnd.getDate()).slice(-2);
        var thisWeek = upcoming.filter(function (i) { return i.dateISO && i.dateISO <= weekEndISO; });
        var rows = thisWeek.length ? thisWeek : upcoming.slice(0, 1);
        if (rows.length) {
          html += '<div class="hm-week-title">' + esc(thisWeek.length ? 'In programma questa settimana' : 'Il prossimo') + '</div>'
            + '<div class="hm-rows">' + rows.map(rowHTML).join('') + '</div>';
        }

        if (!todo.length && !upcoming.length && !mine.undecided.length) {
          html += '<div class="hm-section"><div class="hm-empty">'
            + '<div class="hm-empty-emoji">🗓️</div>'
            + '<div class="hm-empty-title">Niente in programma</div>'
            + '<div class="hm-empty-text">Proponi una serata, una cena o un weekend: scegli il giorno, manda il link nel gruppo e gli amici rispondono con un tocco.</div>'
            + '<a class="primary-btn" href="crea.html" style="display:block; text-decoration:none; margin-bottom:0;">Crea un evento</a>'
            + '</div></div>';
        } else {
          html += '<a class="hm-agenda-btn" href="eventi.html?only=agenda">Apri l\'agenda</a>';
        }
        if (cancelledCount > 0) {
          html += '<div class="hm-foot"><a href="eventi.html?only=annullati">' + esc(cancelledCount === 1 ? t('1 annullato o a cui non vai') : t('{n} annullati o a cui non vai', { n: cancelledCount })) + '</a></div>';
        }
        if (html === lastFeedHTML) return;
        lastFeedHTML = html;
        homeFeed.innerHTML = html;
        bindSwipeDots();
        if (window.SeevaUI) window.SeevaUI.refresh();
      }

      function actionCardHTML(item) {
        var esc = SeevaData.escapeHTML;
        var ev = item.event;
        var href = 'evento.html?id=' + encodeURIComponent(ev.id);
        var who, when, body;
        if (item.kind === 'pickDate') {
          who = 'Organizzi tu';
          when = (item.info && item.info.noVotes) ? 'Nessuno ha votato: scegli tu la data' : 'Pareggio: scegli tu la data';
          body = '<a class="hm-act-btn is-dark" href="' + href + '">Scegli la data</a>';
        } else if (item.kind === 'vote') {
          var n = (ev.dateOptions || []).length;
          who = t('{who} propone {n} date', { who: ev.createdBy || 'Qualcuno', n: n });
          when = (item.info && item.info.voteDeadlineLabel) ? t('Si vota fino a {when}', { when: item.info.voteDeadlineLabel }) : 'Scegli quando puoi';
          body = '<a class="hm-act-btn is-dark" href="' + href + '">Vota le date</a>';
        } else {
          who = t('{who} ti invita', { who: ev.createdBy || 'Qualcuno' });
          when = item.dateISO ? SeevaData.formatDateTimeLabel(item.dateISO, ev.eventTime) : '';
          body = '<div class="my-card-actions hm-act-row" data-event-id="' + esc(ev.id) + '" data-option-id="' + esc(item.optionId || '') + '" data-date-iso="' + esc(item.dateISO || '') + '">'
            + '<button type="button" class="hm-act-btn is-yes" data-quick="yes">Ci sono</button>'
            + '<button type="button" class="hm-act-btn" data-quick="maybe">Forse</button>'
            + '<button type="button" class="hm-act-btn" data-quick="no">No</button>'
            + '</div>';
        }
        var place = '';
        try { place = SeevaData.resolveEventLocation(ev).address || ''; } catch (err) { place = ''; }
        return '<div class="hm-act my-card">'
          + '<a class="hm-act-top" href="' + href + '">'
          + '<div class="hm-act-who" data-no-i18n>' + esc(who) + '</div>'
          + '<div class="hm-act-name" data-no-i18n>' + esc(ev.name) + '</div>'
          + '<div class="hm-act-when">' + esc(when) + (place ? '<span class="hm-act-place" data-no-i18n> · ' + esc(place) + '</span>' : '') + '</div>'
          + '</a>'
          + body
          + '</div>';
      }

      function rowHTML(item) {
        var esc = SeevaData.escapeHTML;
        var ev = item.event;
        var dp = SeevaData.dayParts(item.dateISO);
        var rel = SeevaData.relativeDayWord(item.dateISO);
        var status = item.myKey === 'maybe' ? '<span class="hm-row-st is-maybe">Forse</span>'
          : item.myKey === 'organizer' ? '<span class="hm-row-st is-org">Organizzi</span>'
          : '<span class="hm-row-st is-yes">✓</span>';
        return '<a class="hm-row" href="evento.html?id=' + encodeURIComponent(ev.id) + '">'
          + '<span class="hm-row-date' + (rel ? ' is-soon' : '') + '">' + esc(rel || (dp.dow + ' ' + dp.day)) + '</span>'
          + '<span class="hm-row-name" data-no-i18n>' + esc(ev.name) + '</span>'
          + status + '</a>';
      }

      function bindSwipeDots() {
        var sw = document.getElementById('hmSwipe');
        var dots = document.getElementById('hmDots');
        if (!sw || !dots) return;
        sw.addEventListener('scroll', function () {
          var w = sw.clientWidth || 1;
          var idx = Math.round(sw.scrollLeft / (w * 0.88));
          Array.prototype.forEach.call(dots.children, function (d, i) { d.classList.toggle('on', i === idx); });
        }, { passive: true });
      }

      // Risposta rapida dalle card "Da rispondere" (stessa logica di eventi.html).
      var homeBusyMap = null;
      homeFeed.addEventListener('click', async function (e) {
        var btn = e.target.closest && e.target.closest('[data-quick]');
        if (!btn || homeSaving) return;
        e.preventDefault();
        var box = btn.closest('.my-card-actions');
        var card = btn.closest('.my-card');
        var eventId = box.getAttribute('data-event-id');
        var optionId = box.getAttribute('data-option-id');
        var dateISO = box.getAttribute('data-date-iso');
        var key = btn.getAttribute('data-quick');
        var ev = homeEvents.filter(function (x) { return x.id === eventId; })[0];
        if (!ev) return;
        if (key === 'yes' && dateISO) {
          try {
            if (!homeBusyMap) homeBusyMap = await SeevaData.getMyBusyDates(null);
            var others = (homeBusyMap[dateISO] || []).filter(function (b) { return b.eventId !== eventId; });
            var b = SeevaData.classifyBusy(others, SeevaData.formatTimeLabel(ev.eventTime));
            var unlockKey = 'seeva:busyUnlock:' + eventId + ':' + dateISO;
            var unlocked = false;
            try { unlocked = localStorage.getItem(unlockKey) === '1'; } catch (err) { /* ignora */ }
            if (b.hard.length && !unlocked) {
              if (!await SeevaUI.ask('Quel giorno hai già ' + b.hard.map(SeevaData.busyLabel).join(', ') + '.\n\nVuoi rispondere "Ci sono" lo stesso?')) return;
              try { localStorage.setItem(unlockKey, '1'); } catch (err) { /* ignora */ }
            }
          } catch (err) { /* nel dubbio non blocchiamo */ }
        }
        homeSaving = true;
        var buttons = box.querySelectorAll('button');
        buttons.forEach(function (x) { x.disabled = true; });
        var original = btn.textContent;
        btn.textContent = 'Salvo...';
        try {
          await SeevaData.upsertParticipant(eventId, SeevaData.getGuestName(), key === 'yes' ? [optionId] : [], [], undefined, key === 'maybe');
        } catch (err) {
          homeSaving = false;
          buttons.forEach(function (x) { x.disabled = false; });
          btn.textContent = original;
          SeevaUI.alert('Non sono riuscito a salvare la tua risposta (' + SeevaData.friendlyErrorMessage(err) + '). Riprova.');
          return;
        }
        if (window.SeevaUI && window.SeevaUI.toast) {
          window.SeevaUI.toast(key === 'yes' ? 'Ci sono ✓ — lo trovi in agenda' : key === 'maybe' ? 'Forse 🤔 — lo trovi in agenda' : 'Non ci sono');
        }
        if (card) card.classList.add('is-leaving');
        window.setTimeout(async function () {
          homeSaving = false;
          await refreshHome();
        }, 260);
      });

      var cancelledExtra = 0;
      async function refreshHome(preloaded) {
        var events;
        if (homeSaving) return;
        if (preloaded) {
          events = preloaded;
        } else {
          try {
            events = await SeevaData.getEvents();
          } catch (err) { return; } // silenzioso: resta quello che c'era già in pagina
        }

        // Stessa suddivisione di sempre (vedi eventi.html per la versione
        // gemella usata lì): "waiting" = da confermare (include il pareggio,
        // "tie", che aspetta comunque una scelta dell'organizzatore),
        // "done" = confermati, "cancelled" = annullati. Gli eventi "passato"
        // non contano in nessun riquadro: restano solo nell'archivio del
        // Profilo.
        // Nuova Home (2026-10-04): stessa funzione che usano le liste
        // aperte dai riquadri, quindi i numeri coincidono sempre.
        homeEvents = events;
        var mine = SeevaData.classifyMyEvents(events);
        // Gli annullati a mano non si scaricano con la lista (2026-10-05):
        // qui se ne chiede solo il numero, in sottofondo.
        renderFeed(mine, mine.notGoing.length + cancelledExtra);
        if (!preloaded && SeevaData.getCancelledCount) {
          var activeIds = events.map(function (e) { return e.id; });
          SeevaData.getCancelledCount(activeIds).then(function (n) {
            if (n === cancelledExtra) return;
            cancelledExtra = n;
            renderFeed(SeevaData.classifyMyEvents(homeEvents), mine.notGoing.length + n);
          }, function () { /* ignora */ });
        }

        // Pallino "hai notifiche nuove?" sulla campanella (Fil, 2026-07-17):
        // stessa lista costruita da notifiche.html (SeevaData.buildNotifications,
        // unica fonte di verità), confrontata con l'ultima visita salvata su
        // questo dispositivo. Tutto "best effort": se una delle due letture in
        // più fallisce, il pallino semplicemente non si accende, non deve mai
        // rompere il resto della Home.
        try {
          var myUsernameForBell = (guestName || '').toLowerCase();
          var eventNoticesForBell = [];
          var pendingFriendRequestsForBell = [];
          try { eventNoticesForBell = await SeevaData.getEventNotices(guestName); } catch (err) { /* ignora */ }
          try { pendingFriendRequestsForBell = await SeevaData.getMyPendingFriendRequests(); } catch (err) { /* ignora */ }

          var notificationsForBell = SeevaData.buildNotifications(events, eventNoticesForBell, myUsernameForBell);
          // Fil, 2026-07-19: prima solo un pallino vuoto ("hai qualcosa"), ora
          // il numero vero di non lette dentro — più visibile e fa capire
          // subito quanto c'è da vedere, non solo che c'è qualcosa.
          var unreadCount = SeevaData.countUnreadNotifications(notificationsForBell, pendingFriendRequestsForBell);
          if (bellBadge) {
            if (unreadCount > 0) {
              bellBadge.textContent = unreadCount > 9 ? '9+' : String(unreadCount);
              bellBadge.style.display = '';
            } else {
              bellBadge.style.display = 'none';
            }
          }
          // Fil, 2026-07-23: piccolo tocco in più ora che la campanella è
          // un'icona vera (non più l'emoji 🔔) — trema leggermente quando
          // c'è qualcosa di non letto, si ferma da sola appena letta.
          if (homeBellEl) homeBellEl.classList.toggle('has-unread', unreadCount > 0);

          // Notifica arrivata proprio ora, mentre sei sulla Home (Fil,
          // 2026-08-24): il badge presenza la mostra un attimo. Al primo
          // giro (pagina appena aperta, notificationsForBell contiene tutta
          // la storia pregressa) memorizziamo solo la più recente, senza far
          // scattare l'animazione — altrimenti "lampeggerebbe" ad ogni
          // apertura della Home anche per notifiche vecchie.
          var newestNotif = notificationsForBell[0];
          var newestKey = newestNotif ? [newestNotif.time, newestNotif.eventId, newestNotif.icon].join('|') : null;
          if (!notifBellInitialized) {
            notifBellInitialized = true;
            lastNotifKey = newestKey;
          } else if (newestKey && newestKey !== lastNotifKey) {
            lastNotifKey = newestKey;
            if (window.SeevaUI && window.SeevaUI.flashAttendanceBadge) {
              window.SeevaUI.flashAttendanceBadge(newestNotif.text);
            }
          }
        } catch (err) { /* ignora: il pallino resta semplicemente com'era */ }
      }

      // Avvio istantaneo (2026-10-05): prima disegno con l'ultima lista vista
      // su questo telefono (zero attese), poi subito i dati freschi.
      var instantEvents = SeevaData.getEventsInstant ? SeevaData.getEventsInstant() : null;
      if (instantEvents) {
        refreshHome(instantEvents);
        refreshHome();
      } else {
        await refreshHome();
      }
      // Fil, 2026-07-22: catturato lo stop (startAutoRefresh lo ritorna già
      // da prima) su window.__seevaUnmount, richiamato dal router SPA in
      // script.js prima di cambiare tab — altrimenti questo timer
      // continuerebbe a girare in background anche dopo essere andati via
      // da Home, dato che ora cambiare tab non ricarica più la pagina.
      window.__seevaUnmount = SeevaData.startAutoRefresh(refreshHome);
    })();
  </script>
  <script src="script.js"></script>
</body>
